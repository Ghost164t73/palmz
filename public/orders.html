<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <title>Orders — PALMZ Admin</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5ef;
      --surface: #fff;
      --surface2: #f1efe8;
      --text: #11141c;
      --muted: #6e6d68;
      --line: rgba(17, 20, 28, .12);
      --navy: #0c1227;
      --gold: #c9a34a;
      --red: #b3261e;
      --green: #1f8a4c
    }

    * { box-sizing: border-box }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif
    }
    button, select { font: inherit }
    button, a { cursor: pointer }
    a { color: inherit; text-decoration: none }
    .top { background: var(--navy); color: #fff }
    .wrap { width: min(1120px, calc(100% - 32px)); margin: auto }
    .top .wrap {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px
    }
    .brand { font-weight: 900; letter-spacing: .2em }
    .menu-toggle { width: 42px; height: 42px; padding: 10px; display: grid; align-content: center; gap: 5px; border: 1px solid rgba(255,255,255,.2); border-radius: 16px; background: none; color: #fff }
    .menu-toggle span { height: 2px; background: currentColor; border-radius: 2px }
    .drawer-backdrop { position: fixed; inset: 0; z-index: 60; border: 0; background: rgba(5,9,20,.5); opacity: 0; visibility: hidden; transition: opacity .22s,visibility .22s }
    .drawer-backdrop.open { opacity: 1; visibility: visible }
    .admin-drawer { position: fixed; z-index: 61; inset: 0 0 0 auto; width: min(330px,86vw); padding: 22px; background: var(--navy); color: #fff; border-radius: 24px 0 0 24px; transform: translateX(102%); transition: transform .25s ease; box-shadow: -14px 0 40px rgba(0,0,0,.2) }
    .admin-drawer.open { transform: translateX(0) }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 22px; border-bottom: 1px solid rgba(255,255,255,.14) }
    .drawer-title { font-weight: 900; letter-spacing: .18em }
    .drawer-title small { display: block; margin-top: 5px; color: var(--gold); font-size: 10px; letter-spacing: .14em }
    .drawer-close { width: 38px; height: 38px; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; background: none; color: #fff; font-size: 23px }
    .drawer-links { display: grid; gap: 8px; padding: 20px 0 }
    .drawer-links a,.drawer-links button { display: block; width: 100%; padding: 13px 14px; border: 0; border-radius: 14px; background: transparent; color: #eeece5; text-align: left; font-size: 14px }
    .drawer-links a:hover,.drawer-links a[aria-current="page"],.drawer-links button:hover { background: rgba(255,255,255,.09) }
    .drawer-links a[aria-current="page"] { color: var(--gold); font-weight: 800 }
    .drawer-links a[href="/admin/orders"] { display:flex;align-items:center }
    .orders-notification { min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;margin-left:auto;border-radius:999px;background:#d9473f;color:#fff;font-size:10px;font-weight:850;letter-spacing:0 }
    .orders-notification[hidden] { display:none }
    body.menu-open { overflow: hidden }
    main { padding: 28px 0 60px }
    .heading { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap }
    h1 { margin: 0; font: 700 32px Georgia, serif }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.6 }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0 }
    .stat { padding: 14px 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface) }
    .stat b { display: block; font-size: 22px }
    .stat span { color: var(--muted); font-size: 11px }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px }
    .toolbar select { min-width: 210px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text) }
    #refreshOrders { display:inline-flex;align-items:center;justify-content:center;gap:9px;min-width:112px;padding:11px 17px;border:1px solid var(--navy);border-radius:999px;background:var(--navy);color:#fff;font-weight:750;box-shadow:0 5px 14px rgba(12,18,39,.16);transition:background .18s,transform .18s,box-shadow .18s }
    #refreshOrders:hover:not(:disabled) { background:#202b4c;box-shadow:0 7px 18px rgba(12,18,39,.22);transform:translateY(-1px) }
    #refreshOrders:focus-visible { outline:3px solid var(--gold);outline-offset:3px }
    #refreshOrders:disabled { opacity:.72;cursor:wait }
    #refreshOrders::before { content:"↻";font-size:18px;line-height:1 }
    #refreshOrders:disabled::before { display:none }
    .orders { display: grid; gap: 12px }
    .order { overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: var(--surface) }
    .order-details > summary { display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;cursor:pointer;list-style:none }
    .order-details > summary::-webkit-details-marker { display:none }
    .order-details > summary::after { content:"+";flex:0 0 30px;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--muted);font-size:20px;transition:transform .18s }
    .order-details[open] > summary::after { content:"−";color:var(--text) }
    .order-details[open] > summary { border-bottom:1px solid var(--line) }
    .order-summary-main { min-width:0 }
    .order-summary-meta { display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;text-align:right }
    .order-badge { padding:6px 9px;border-radius:999px;background:var(--surface2);font-size:11px;font-weight:750;white-space:nowrap }
    .order-badge.payment-paid { background:#e3f4e9;color:#176b38 }
    .order-id { font-size: 11px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere }
    .order-content { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 18px; padding: 16px }
    .label { margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase }
    .customer-name { font-weight: 800 }
    .contact { margin-top: 8px; font-size: 12px; line-height: 1.7; overflow-wrap: anywhere }
    .contact a { text-decoration: underline; text-underline-offset: 2px }
    .items { margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.8 }
    .order-note { margin-top: 8px; color: var(--muted); font-size: 12px; white-space: pre-wrap }
    .order-manage { display: grid; align-content: start; gap: 10px }
    .order-manage select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface2); color: var(--text) }
    .payment { font-size: 12px; color: var(--muted); line-height: 1.5 }
    .payment-form { display:grid;gap:8px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface2) }
    .payment-form label { display:grid;gap:5px;color:var(--text);font-size:11px;font-weight:700 }
    .payment-form input { width:100%;min-width:0;padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text) }
    .payment-form button { padding:10px;border:0;border-radius:999px;background:var(--green);color:#fff;font-weight:800 }
    .payment-form button:disabled { opacity:.6;cursor:wait }
    .message { padding: 42px 14px; border: 1px dashed var(--line); border-radius: 22px; background: var(--surface); text-align: center; color: var(--muted) }
    .loading-indicator { display: inline-flex; align-items: center; gap: 9px }
    .spinner { width: 15px; height: 15px; flex: 0 0 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite }
    @keyframes spin { to { transform: rotate(360deg) } }
    button.is-loading { position: relative; color: transparent !important; pointer-events: none }
    button.is-loading::after { content: ""; position: absolute; left: 50%; top: 50%; width: 15px; height: 15px; margin: -8px; border: 2px solid currentColor; border-color: var(--navy) var(--navy) transparent transparent; border-radius: 50%; animation: spin .7s linear infinite }
    .payment-form button.is-loading::after { border-color: #fff; border-right-color: transparent }
    .toast { position: fixed; left: 50%; bottom: 20px; padding: 11px 16px; border-radius: 999px; background: var(--navy); color: #fff; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .2s }
    .toast.show { transform: translate(-50%, 0); opacity: 1 }
    .toast.error { background: var(--red) }
    [hidden] { display: none !important }
    @media(max-width:760px) {
      .stats { grid-template-columns: repeat(2, 1fr) }
      .order-content { grid-template-columns: 1fr 1fr }
      .order-manage { grid-column: 1 / -1 }
    }
    @media(max-width:500px) {
      .order-content { grid-template-columns: 1fr }
      .order-manage { grid-column: auto }
      .order-top { align-items: start; flex-direction: column }
      .top-actions { gap: 8px }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a href="/admin" class="brand">PALMZ ADMIN</a>
      <button class="menu-toggle" type="button" aria-label="Open admin navigation" aria-expanded="false" aria-controls="adminDrawer" onclick="toggleAdminMenu(true)"><span></span><span></span><span></span></button>
    </div>
  </header>
  <button class="drawer-backdrop" id="drawerBackdrop" type="button" aria-label="Close navigation" onclick="toggleAdminMenu(false)"></button>
  <aside class="admin-drawer" id="adminDrawer" aria-label="Admin navigation" aria-hidden="true" inert>
    <div class="drawer-head"><div class="drawer-title">PALMZ<small>ADMIN MENU</small></div><button class="drawer-close" type="button" aria-label="Close navigation" onclick="toggleAdminMenu(false)">×</button></div>
    <nav class="drawer-links"><a href="/admin">Inventory</a><a href="/admin/orders" aria-current="page">Orders <span class="orders-notification" hidden aria-label="Pending orders"></span></a><a href="/admin/sales">Sales history</a><a href="/" target="_blank" rel="noopener">View store ↗</a><button type="button" onclick="logout()">Sign out</button></nav>
  </aside>
  <main class="wrap">
    <div class="heading">
      <div><h1>Orders</h1><div class="muted">Confirming or fulfilling an order deducts its color and size stock. Cancelling returns the stock.</div></div>
      <button id="refreshOrders" type="button" onclick="loadOrders()">Refresh</button>
    </div>
    <section class="stats" id="stats" aria-live="polite"></section>
    <div class="toolbar">
      <label for="statusFilter">Show orders</label>
      <select id="statusFilter" onchange="loadOrders()">
        <option value="all">All statuses</option>
        <option value="pending_confirmation">Pending confirmation</option>
        <option value="confirmed">Confirmed</option>
        <option value="fulfilled">Fulfilled</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <span class="muted" id="resultCount"></span>
    </div>
    <section class="orders" id="orders" aria-live="polite"><div class="message"><span class="loading-indicator"><span class="spinner" aria-hidden="true"></span>Loading orders…</span></div></section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const $ = selector => document.querySelector(selector);
    function toggleAdminMenu(open) {
      const drawer = $("#adminDrawer"), backdrop = $("#drawerBackdrop"), toggle = $(".menu-toggle");
      drawer.classList.toggle("open", open); backdrop.classList.toggle("open", open);
      drawer.setAttribute("aria-hidden", String(!open)); drawer.inert = !open; toggle.setAttribute("aria-expanded", String(open));
      document.body.classList.toggle("menu-open", open);
      if (open) $(".drawer-close").focus(); else toggle.focus();
    }
    document.addEventListener("keydown", event => { if (event.key === "Escape" && $("#adminDrawer").classList.contains("open")) toggleAdminMenu(false); });
    const STATUS_LABELS = {
      pending_confirmation: "Pending confirmation",
      confirmed: "Confirmed",
      fulfilled: "Fulfilled",
      cancelled: "Cancelled"
    };
    const PAYMENT_LABELS = {
      not_started: "Not started",
      pending: "Pending",
      paid: "Paid",
      failed: "Failed",
      refunded: "Refunded"
    };

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    async function request(url, options = {}) {
      const response = await fetch(url, { credentials: "same-origin", ...options });
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) {
        location.replace("/admin?next=orders");
        throw new Error("Your admin session has expired. Please sign in again.");
      }
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function showMessage(message, error = false, loading = false) {
      const content = loading ? `<span class="loading-indicator"><span class="spinner" aria-hidden="true"></span>${escapeHtml(message)}</span>` : escapeHtml(message);
      $("#orders").innerHTML = `<div class="message">${content}</div>`;
      $("#resultCount").textContent = "";
      if (error) toast(message, true);
    }

    function renderStats(orders) {
      const counts = Object.fromEntries(Object.keys(STATUS_LABELS).map(status => [status, orders.filter(order => order.status === status).length]));
      $("#stats").innerHTML = `
        <div class="stat"><b>${orders.length}</b><span>Orders shown</span></div>
        <div class="stat"><b>${counts.pending_confirmation}</b><span>Pending confirmation</span></div>
        <div class="stat"><b>${counts.confirmed}</b><span>Confirmed</span></div>
        <div class="stat"><b>${counts.fulfilled}</b><span>Fulfilled</span></div>`;
    }

    function renderOrder(order) {
      const date = new Intl.DateTimeFormat("en-NG", { dateStyle: "medium", timeStyle: "short" }).format(new Date(order.createdAt));
      const phoneDigits = order.phone.replace(/\D/g, "");
      const whatsappNumber = phoneDigits.startsWith("0") ? `234${phoneDigits.slice(1)}` : phoneDigits;
      const items = order.items.map(item => `<li>${item.quantity} × ${escapeHtml(item.name)} — size ${escapeHtml(item.size)}, ${escapeHtml(item.color)}${item.unitPrice != null ? ` — ₦${Number(item.unitPrice).toLocaleString("en-NG")} each` : ""}</li>`).join("");
      const paymentStatus = PAYMENT_LABELS[order.paymentStatus] || "Not started";
      const paymentIsPaid = order.paymentStatus === "paid";
      return `<article class="order" data-id="${escapeHtml(order._id)}">
        <details class="order-details">
          <summary>
            <div class="order-summary-main"><strong>${escapeHtml(order.customerName)}</strong><div class="order-id">Order ${escapeHtml(order._id)} · ${date}</div></div>
            <div class="order-summary-meta"><span class="order-badge">${escapeHtml(STATUS_LABELS[order.status] || order.status)}</span><span class="order-badge${paymentIsPaid ? " payment-paid" : ""}">${escapeHtml(paymentStatus)}</span>${order.inventoryReserved ? '<span class="order-badge">Stock held</span>' : ''}</div>
          </summary>
          <div class="order-content">
          <section><div class="label">Customer</div><div class="customer-name">${escapeHtml(order.customerName)}</div><div class="contact"><a href="mailto:${encodeURIComponent(order.email)}">${escapeHtml(order.email)}</a><br><a href="tel:${encodeURIComponent(order.phone)}">${escapeHtml(order.phone)}</a>${whatsappNumber ? `<br><a target="_blank" rel="noopener noreferrer" href="https://wa.me/${encodeURIComponent(whatsappNumber)}">Message on WhatsApp</a>` : ""}<br>${order.fulfillmentMethod === "pickup" ? `Pickup: ${escapeHtml(order.pickupBranchName || "Branch")}<br>${escapeHtml(order.pickupBranchAddress || order.address)}<br>${escapeHtml(order.city)}` : `Delivery: ${escapeHtml(order.address)}<br>${escapeHtml(order.city)}${order.deliveryFee ? `<br>Delivery fee: ₦${Number(order.deliveryFee).toLocaleString("en-NG")}${order.deliveryEstimate ? ` · ${escapeHtml(order.deliveryEstimate)}` : ""}` : ""}`}${order.totalAmount != null ? `<br>Order total: ₦${Number(order.totalAmount).toLocaleString("en-NG")}` : ""}</div></section>
          <section><div class="label">Items</div><ul class="items">${items}</ul>${order.note ? `<div class="order-note"><strong>Note:</strong> ${escapeHtml(order.note)}</div>` : ""}</section>
          <section class="order-manage"><div class="label">Order status</div><select aria-label="Update order status" onchange="updateStatus('${escapeHtml(order._id)}', this.value, this)">${Object.entries(STATUS_LABELS).map(([value, label]) => `<option value="${value}" ${order.status === value ? "selected" : ""}>${label}</option>`).join("")}</select><div class="payment"><strong>Payment:</strong> ${escapeHtml(order.paymentProvider || "whatsapp")} · ${escapeHtml(paymentStatus)}${Number.isSafeInteger(order.paidAmountKobo) ? `<br>Amount received: ₦${(order.paidAmountKobo / 100).toLocaleString("en-NG", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : ""}${Number.isSafeInteger(order.paystackFeeKobo) && order.paystackFeeKobo > 0 ? `<br>Paystack checkout charge: ₦${(order.paystackFeeKobo / 100).toLocaleString("en-NG", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} (not added by PALMZ)` : ""}${order.paystackReference ? `<br>Paystack reference: ${escapeHtml(order.paystackReference)}` : ""}${order.paymentReference ? `<br>Payment reference: ${escapeHtml(order.paymentReference)}` : ""}<br>Payment tracking is separate from order status.</div>
            ${order.paymentProvider === "whatsapp" && !paymentIsPaid ? `<form class="payment-form" onsubmit="recordManualPayment(event, '${escapeHtml(order._id)}')"><label>Amount received (₦)<input name="amount" type="number" min="${order.totalAmount != null ? Number(order.totalAmount).toFixed(2) : "0.01"}" step="0.01" required></label><label>Payment reference <span class="muted">(optional)</span><input name="reference" type="text" maxlength="120" placeholder="Bank transfer reference"></label><button type="submit">Record payment received</button></form>` : ""}
          </section>
          </div>
        </details>
      </article>`;
    }

    async function loadOrders() {
      const refreshButton = $("#refreshOrders");
      refreshButton.disabled = true;
      refreshButton.innerHTML = '<span class="loading-indicator"><span class="spinner" aria-hidden="true"></span>Loading</span>';
      showMessage("Loading orders…", false, true);
      try {
        const status = $("#statusFilter").value;
        const { orders } = await request(`/api/admin/orders?status=${encodeURIComponent(status)}`);
        renderStats(orders);
        $("#resultCount").textContent = `${orders.length} order${orders.length === 1 ? "" : "s"}`;
        $("#orders").innerHTML = orders.length ? orders.map(renderOrder).join("") : '<div class="message">No orders found for this status.</div>';
      } catch (error) {
        if (!/session has expired/.test(error.message)) showMessage(error.message, true);
      } finally {
        refreshButton.disabled = false;
        refreshButton.textContent = "Refresh";
      }
    }

    async function updateStatus(id, status, select) {
      select.disabled = true;
      const loading = document.createElement("span");
      loading.className = "loading-indicator";
      loading.setAttribute("role", "status");
      loading.innerHTML = '<span class="spinner" aria-hidden="true"></span>Updating status…';
      select.after(loading);
      try {
        await request(`/api/admin/orders/${encodeURIComponent(id)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status })
        });
        toast("Order status updated");
        await loadOrders();
      } catch (error) {
        toast(error.message, true);
        await loadOrders();
      } finally {
        loading.remove();
      }
    }

    async function recordManualPayment(event, id) {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      button.classList.add("is-loading");
      button.textContent = "Recording payment…";
      try {
        await request(`/api/admin/orders/${encodeURIComponent(id)}/payment`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            amount: form.elements.amount.value,
            reference: form.elements.reference.value
          })
        });
        toast("WhatsApp payment recorded");
        await loadOrders();
      } catch (error) {
        toast(error.message, true);
        button.disabled = false;
        button.classList.remove("is-loading");
        button.textContent = "Record payment received";
      }
    }

    async function logout() {
      try {
        await fetch("/api/admin/logout", { method: "POST", credentials: "same-origin" });
        location.replace("/admin");
      } catch (error) {
        toast(error.message, true);
      }
    }

    function toast(message, error = false) {
      const element = $("#toast");
      element.textContent = message;
      element.classList.toggle("error", error);
      element.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => element.classList.remove("show"), 2400);
    }

    loadOrders();
  </script>
  <script src="/admin-notifications.js"></script>
</body>
</html>
