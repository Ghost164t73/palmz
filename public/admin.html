<title>PALMZ Admin</title>
<style>

.drawer-links a[href="/admin/orders"]{display:flex;align-items:center}

.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:var(--gold);color:#111}

.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}

.login{max-width:380px;margin:90px auto;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px}

.err{color:var(--red);font-size:12px;min-height:16px;margin-top:10px}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}

.stat b{display:block;font-size:22px}
.stat span{font-size:11px;color:var(--muted)}
.list{display:grid;gap:12px;padding-bottom:60px}
.item{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px}

.item h3{margin:0 0 4px;font-size:15px}
.meta{font-size:12px;color:var(--muted);line-height:1.6}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;margin-left:6px;color:#fff;vertical-align:middle}
.chip.ok{background:var(--green)}.chip.out{background:var(--red)}.chip.off{background:#888}.chip.low{background:var(--gold);color:#111}
.ctrl{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.row{display:flex;gap:8px;align-items:center}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface2)}
.stepper button{width:32px;height:32px;border:0;background:none;font-size:16px}
.stepper input{width:54px;text-align:center;border:0;background:none;padding:6px 0;border-radius:0}
.switch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer}
.switch input{width:auto;accent-color:var(--navy)}
.small{padding:7px 12px;font-size:12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.small.del{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:60px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:22px}
.loading-state{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;color:var(--muted);font-size:13px}.spinner{width:16px;height:16px;flex:0 0 16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.loading-row td{padding:12px 16px}.loading-bar{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface2) 25%,#e5e1d6 42%,var(--surface2) 63%);background-size:300% 100%;animation:shimmer 1.3s ease-in-out infinite}.loading-bar.short{width:45%}@keyframes shimmer{to{background-position:-150% 0}}button.is-loading{position:relative;color:transparent!important;pointer-events:none}button.is-loading::after{content:"";position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-8px;border:2px solid var(--navy);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}.btn.dark.is-loading::after{border-color:#fff;border-right-color:transparent}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px;z-index:50}
.modal.open{display:grid}
.box{width:min(620px,100%);max-height:94vh;overflow:auto;background:var(--surface);border-radius:28px;padding:22px}
.box h3{margin:0 0 4px;font:700 26px Georgia,serif}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:5px}
.preview-gallery img,.preview-empty{width:100%;height:100px;border:1px dashed var(--line);border-radius:14px;background:var(--surface2);object-fit:cover}
.preview-empty{display:grid;place-items:center;color:var(--muted);font-size:12px}
.hint{font-size:11px;color:var(--muted);margin-top:4px;font-weight:400}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--text);font-weight:600}
.check input{width:auto;margin:0}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-size:12px;font-weight:800;transition:.2s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--red)}
.inventory-tools{display:grid;grid-template-columns:minmax(220px,1fr) 180px 180px;gap:10px;margin:18px 0}
.table-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;margin-bottom:24px}
table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;background:#faf9f5}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.selected{background:#f7f3e8}tbody tr:last-child td{border:0}.product-cell{display:flex;align-items:center;gap:12px;font-weight:750}.product-cell img{width:42px;height:42px;object-fit:cover;border-radius:9px;background:var(--surface2)}
.detail{display:none;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;margin:0 0 40px;scroll-margin-top:18px}.detail.open{display:block}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.detail h3{margin:0;font-size:18px}.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.size-stock{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:10px 13px;font-size:12px}.size-stock b{display:block;font-size:16px;margin-top:3px}.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.detail-actions .icon-action{width:46px;height:46px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:18px;background:#f5f3ed;color:var(--navy);transition:transform .18s,background .18s,border-color .18s}.detail-actions .icon-action:hover{transform:translateY(-2px);background:#eee9dc;border-color:rgba(17,20,28,.22)}.detail-actions .icon-action.receive{background:#edf5ef;color:#247448;border-color:#d6e9dc}.detail-actions .icon-action.edit{background:#f5f0e3;color:#86651f;border-color:#e9dec2}.detail-actions .icon-action.history{background:#eef1f7;color:#43577e;border-color:#dce2ee}.detail-actions .icon-action.delete{background:#faeeec;color:#b3261e;border-color:#f0d8d4}.detail-actions .icon-action:focus-visible{outline:3px solid rgba(201,163,74,.55);outline-offset:2px}.detail-actions svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.detail .hint{margin-top:12px}.matrix{width:100%;min-width:0;margin:12px 0 16px}.matrix th,.matrix td{padding:10px;text-align:center}.matrix th:first-child,.matrix td:first-child{text-align:left}.variant-total{font-weight:800}.variant-control{display:flex;align-items:center;justify-content:center;gap:6px}.variant-control button{width:25px;height:25px;padding:0;line-height:1;border-radius:8px}.variant-control span{min-width:18px;font-weight:750}
@media(max-width:640px){.inventory-tools{grid-template-columns:1fr 1fr}.inventory-tools input{grid-column:1/-1}.bar h2{font-size:26px}}
@media(max-width:640px){.item{grid-template-columns:70px 1fr}.item img{width:70px;height:70px}.ctrl{grid-column:1/-1;flex-direction:row;justify-content:space-between;flex-wrap:wrap;align-items:center}.two{grid-template-columns:1fr}}
</style>
<style>

</head>
<body>
<div class="loading-state" id="bootView" role="status"><span class="spinner" aria-hidden="true"></span><span>Checking admin session…</span></div>

<div id="loginView" style="display:none">
  <form class="login" onsubmit="login(event)">
    <h1>PALMZ Admin</h1>
    <p>Sign in to manage your palms, sizes and stock.</p>
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn dark" style="width:100%;margin-top:6px" type="submit">Sign in</button>
  </form>
</div>

<div id="appView" style="display:none">
  <div class="top"><div class="wrap">
    <div class="brand">PALMZ<small>ADMIN</small></div>
    <button class="menu-toggle" type="button" aria-label="Open admin navigation" aria-expanded="false" aria-controls="adminDrawer" onclick="toggleAdminMenu(true)"><span></span><span></span><span></span></button>
  </div></div>
  <div class="wrap">
    <div class="bar"><h2>Inventory</h2><button class="btn" onclick="openForm()">+ Add product</button></div>
    <div class="stats" id="stats"></div>
    <div class="inventory-tools"><input id="search" placeholder="Search products…" oninput="inventoryPage=1;renderTable()"><select id="category" onchange="inventoryPage=1;renderTable()"><option value="">All categories</option></select><select id="stockFilter" onchange="inventoryPage=1;renderTable()"><option value="">All stock statuses</option><option value="In stock">In stock</option><option value="Low stock">Low stock</option><option value="Sold out">Sold out</option><option value="Unavailable">Unavailable</option></select></div>
    <div class="table-wrap"><table><thead><tr><th>Product</th><th>Variant</th><th>Size</th><th>Stock</th><th>Status</th></tr></thead><tbody id="list"></tbody></table></div><div class="pagination" id="inventoryPagination"></div>
    <section class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Product inventory details" onclick="if(event.target===this)closeDetail()"></section>
  </div>
</div>

<button class="drawer-backdrop" id="drawerBackdrop" type="button" aria-label="Close navigation" onclick="toggleAdminMenu(false)"></button>
<aside class="admin-drawer auth-hidden" id="adminDrawer" aria-label="Admin navigation" aria-hidden="false">
  <div class="drawer-head"><div class="drawer-title">PALMZ<small>ADMIN MENU</small></div><button class="drawer-close" type="button" aria-label="Close navigation" onclick="toggleAdminMenu(false)">×</button></div>
  <nav class="drawer-links">
    <a href="/admin" aria-current="page">Inventory</a>
    <a href="/admin/orders">Orders <span class="orders-notification" hidden aria-label="Pending orders"></span></a>
    <a href="/admin/sales">Sales history</a>
    <a href="/" target="_blank" rel="noopener">View store ↗</a>
    <button type="button" onclick="logout()">Sign out</button>
  </nav>
</aside>

<div class="modal" id="formModal" onclick="if(event.target===this)closeForm()">
  <form class="box" id="form" onsubmit="saveProduct(event)">
    <h3 id="formTitle">Add product</h3>
    <label>Product photos <span class="hint">(up to 12 images, 4MB total; upload in the order customers should browse. New photos replace the current gallery.)</span>
      <div class="preview-gallery" id="preview"><div class="preview-empty">No photos chosen</div></div>
      <input type="file" id="images" accept="image/jpeg,image/png,image/webp" multiple onchange="previewImg()">
    </label>
    <label>Name<input id="name" required maxlength="80" placeholder="e.g. Signature Cross"></label>
    <div class="two">
      <label>Category <span class="hint">(used for the store filters; choose Foreign Footwear for imported styles)</span><input id="type" list="types" maxlength="40" placeholder="e.g. Cross Strap"><datalist id="types"></datalist></label>
      <label>Price (₦) <span class="hint">(leave empty = "Price via WhatsApp")</span><input id="price" type="number" min="0" step="1"></label>
    </div>
    <label>Description<textarea id="desc" rows="2" maxlength="400"></textarea></label>
    <label>Colours / variants <span class="hint">(separate with commas)</span><input id="colors" placeholder="e.g. Navy / Black, Tan"></label>
    <div class="two">
      <label>Smallest size<input id="sizeMin" type="number" min="20" max="60" step="1" required value="43"></label>
      <label>Largest size<input id="sizeMax" type="number" min="20" max="60" step="1" required value="48"></label>
    </div>
    <div class="two"><label>Opening stock<input id="quantity" type="number" min="0" step="1" required value="0"></label><div class="hint" style="align-self:center">Opening stock is distributed evenly across the selected sizes.</div></div>
    <label class="check"><input type="checkbox" id="available" checked> Available for sale</label>
    <div class="err" id="formErr"></div>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeForm()">Cancel</button><button class="btn dark" id="saveBtn" type="submit">Save product</button></div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let products = [], editingId = null, selectedId = null, inventoryPage = 1, inventoryPageSize = 8;
let previewUrls = [];

function toast(t, bad) { const el = $("#toast"); el.textContent = t; el.className = "toast show" + (bad ? " bad" : ""); clearTimeout(window.__t); window.__t = setTimeout(() => el.classList.remove("show"), 2200); }
function showLogin() { $("#bootView").style.display = "none"; $("#appView").style.display = "none"; $("#loginView").style.display = "block"; $("#adminDrawer").classList.add("auth-hidden"); }
function showApp() {
  if (new URLSearchParams(location.search).get("next") === "orders") {
    location.replace("/admin/orders");
    return false;
  }
  $("#bootView").style.display = "none"; $("#loginView").style.display = "none"; $("#appView").style.display = "block"; $("#adminDrawer").classList.remove("auth-hidden");
  return true;
}

async function api(url, opts = {}) {
  const r = await fetch(url, { credentials: "same-origin", ...opts });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && !url.includes("/login")) { showLogin(); throw new Error("Please sign in again"); }
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
}

async function login(e) {
  e.preventDefault(); $("#loginErr").textContent = "";
  const button = e.currentTarget.querySelector('button[type="submit"]');
  button.disabled = true; button.classList.add("is-loading"); button.textContent = "Signing in…";
  try {
    await api("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("#pw").value }) });
    $("#pw").value = ""; if (showApp()) load();
  } catch (err) { $("#loginErr").textContent = err.message; }
  finally { button.disabled = false; button.classList.remove("is-loading"); button.textContent = "Sign in"; }
}
async function logout() { toggleAdminMenu(false); await fetch("/api/admin/logout", { method: "POST" }); showLogin(); }
function toggleAdminMenu(open) {
  const drawer = $("#adminDrawer"), backdrop = $("#drawerBackdrop"), toggle = $(".menu-toggle");
  drawer.classList.toggle("open", open); backdrop.classList.toggle("open", open);
  drawer.setAttribute("aria-hidden", String(!open)); drawer.inert = !open; toggle.setAttribute("aria-expanded", String(open));
  document.body.classList.toggle("menu-open", open);
  if (open) $(".drawer-close").focus(); else toggle.focus();
}
function syncAdminMenuForViewport(){const drawer=$("#adminDrawer"),desktop=window.matchMedia("(min-width: 761px)").matches;if(desktop){drawer.classList.remove("open");drawer.setAttribute("aria-hidden","false");drawer.inert=false;document.body.classList.remove("menu-open")}else if(!drawer.classList.contains("open")){drawer.setAttribute("aria-hidden","true");drawer.inert=true}}
window.addEventListener("resize",syncAdminMenuForViewport);syncAdminMenuForViewport();
document.addEventListener("keydown", event => { if(event.key==="Escape"&&$("#detail").classList.contains("open")){closeDetail();return} if (event.key === "Escape" && $("#adminDrawer").classList.contains("open")) toggleAdminMenu(false); });

async function load() {
  $("#list").setAttribute("aria-busy", "true");
  $("#list").innerHTML = Array.from({length: 4}, () => '<tr class="loading-row" aria-hidden="true"><td><div class="loading-bar"></div></td><td><div class="loading-bar short"></div></td><td><div class="loading-bar short"></div></td><td><div class="loading-bar short"></div></td><td><div class="loading-bar short"></div></td></tr>').join("");
  try { products = (await api("/api/products")).products; $("#list").setAttribute("aria-busy", "false"); render(); }
  catch (err) { $("#list").setAttribute("aria-busy", "false"); $("#list").innerHTML = `<tr><td colspan="5" class="empty">${esc(err.message)}</td></tr>`; toast(err.message, true); }
}

function variantKey(color,size){return `${encodeURIComponent(String(color)).replace(/\./g,'%2E').replace(/\$/g,'%24')}__${size}`}
function variantQuantities(p){
 const raw=p.stockByVariant||{};if(Object.keys(raw).length)return raw;
 const colors=p.colors&&p.colors.length?p.colors:['Standard'],sizes=Array.from({length:p.sizeMax-p.sizeMin+1},(_,i)=>String(p.sizeMin+i)),out={},legacy=p.stockBySize||{};
 if(Object.keys(legacy).length){sizes.forEach(size=>{const count=Number(legacy[size]||0);colors.forEach((color,i)=>out[variantKey(color,size)]=Math.floor(count/colors.length)+(i<count%colors.length?1:0))})}
 else{const combinations=colors.length*sizes.length,each=Math.floor((p.quantity||0)/combinations),rem=(p.quantity||0)%combinations;let i=0;colors.forEach(color=>sizes.forEach(size=>out[variantKey(color,size)]=each+(i++<rem?1:0)))}
 return out;
}
function total(p){return Object.values(variantQuantities(p)).reduce((a,b)=>a+Number(b||0),0)}function stockStatus(p){const n=total(p);return !p.available?'Unavailable':n===0?'Sold out':n<=5?'Low stock':'In stock'}
function badge(s){return `<span class="chip ${s==='In stock'?'ok':s==='Low stock'?'low':s==='Sold out'?'out':'off'}">${s}</span>`}
function render(){
 const sum=products.reduce((a,p)=>a+total(p),0);
 $("#stats").innerHTML=`<div class="stat"><b>${products.length}</b><span>Products</span></div><div class="stat"><b>${sum}</b><span>Pairs available</span></div><div class="stat"><b>${products.filter(p=>stockStatus(p)==='Low stock').length}</b><span>Low stock</span></div><div class="stat"><b>${products.filter(p=>stockStatus(p)==='Sold out').length}</b><span>Sold out</span></div>`;
 const categories=[...new Set([...products.map(p=>p.type),'Foreign Footwear'])];
 $("#types").innerHTML=categories.map(t=>`<option value="${esc(t)}">`).join("");
 const sel=$("#category"), old=sel.value;sel.innerHTML='<option value="">All categories</option>'+categories.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');sel.value=old;
 renderTable(); if(selectedId&&products.some(p=>p.id===selectedId))renderDetail(products.find(p=>p.id===selectedId));else{$("#detail").classList.remove('open');document.body.style.overflow='';selectedId=null}
}
function renderPagination(selector,total,page,pageSize,onPage,onPageSize){
 const el=$(selector),pages=Math.ceil(total/pageSize),first=total?(page-1)*pageSize+1:0,last=Math.min(page*pageSize,total);if(!pages){el.innerHTML='';return}
 let numbers=[];if(pages<=3){numbers=Array.from({length:pages},(_,i)=>i+1)}else if(page<=3){numbers=[1,2,3]}else if(page>=pages-2){numbers=[pages-2,pages-1,pages]}else{numbers=[page-1,page,page+1]}
 const button=(label,target,disabled=false,current=false)=>`<button type="button" data-page="${target}" ${disabled?'disabled':''} ${current?'aria-current="page"':''} aria-label="${typeof label==='number'?'Page '+label:label}">${label}</button>`;
 el.innerHTML=`<div class="pager-pages">${button('‹',page-1,page<=1)}${numbers.map(n=>button(n,n,false,n===page)).join('')}${pages>3&&numbers[numbers.length-1]<pages-1?`<span class="pager-ellipsis" aria-hidden="true">…</span>${button(pages,pages,false,pages===page)}`:''}${button('›',page+1,page>=pages)}</div><div class="pager-meta"><span class="pager-summary">Showing ${first} to ${last} of ${total} entries</span><label class="pager-size">Show <select class="pager-select" aria-label="Rows per page">${[8,16,24,50].map(n=>`<option value="${n}" ${n===pageSize?'selected':''}>${n}</option>`).join('')}</select></label></div>`;
 el.onclick=e=>{const b=e.target.closest('button[data-page]');if(b&&!b.disabled)onPage(Number(b.dataset.page))};el.onchange=e=>{if(e.target.matches('.pager-select'))onPageSize(Number(e.target.value))};
}
function renderTable(){
 const q=$("#search").value.toLowerCase(),cat=$("#category").value,f=$("#stockFilter").value;
 const rows=products.filter(p=>(!q||`${p.name} ${p.type} ${(p.colors||[]).join(' ')}`.toLowerCase().includes(q))&&(!cat||p.type===cat)&&(!f||stockStatus(p)===f));
 inventoryPage=Math.max(1,Math.min(inventoryPage,Math.ceil(rows.length/inventoryPageSize)||1));const start=(inventoryPage-1)*inventoryPageSize,pageRows=rows.slice(start,start+inventoryPageSize);
 $("#list").innerHTML=pageRows.length?pageRows.map(p=>`<tr data-id="${p.id}" class="${selectedId===p.id?'selected':''}"><td><div class="product-cell"><img src="${esc(p.image)}" alt=""><span>${esc(p.name)}</span></div></td><td>${(p.colors||[]).map(esc).join(', ')}</td><td>${p.sizeMin}–${p.sizeMax}</td><td><b>${total(p)}</b></td><td>${badge(stockStatus(p))}</td></tr>`).join(''):`<tr><td colspan="5" class="empty">${products.length?'No products match these filters.':'No products yet. Add your first product.'}</td></tr>`;
 renderPagination("#inventoryPagination",rows.length,inventoryPage,inventoryPageSize,(page)=>{inventoryPage=page;renderTable()},(size)=>{inventoryPageSize=size;inventoryPage=1;renderTable()});
}
function closeDetail(){selectedId=null;$("#detail").classList.remove("open");document.body.style.overflow="";renderTable()}
function renderDetail(p){
 const d=$("#detail"),q=variantQuantities(p),colors=p.colors&&p.colors.length?p.colors:['Standard'],sizes=Array.from({length:p.sizeMax-p.sizeMin+1},(_,i)=>String(p.sizeMin+i));d.classList.add('open');document.body.style.overflow='hidden';
 d.innerHTML=`<div class="detail-panel"><div class="detail-head"><h3>${esc(p.name)} · ${esc(p.type)}</h3><button class="small" data-act="close">Close</button></div><div class="meta">Stock by color and size · adjust each variant here</div><div class="table-wrap"><table class="matrix"><thead><tr><th>Color</th>${sizes.map(s=>`<th>${s}</th>`).join('')}<th>Total</th></tr></thead><tbody>${colors.map(color=>{const row=sizes.map(size=>Number(q[variantKey(color,size)]||0));return `<tr><td>${esc(color)}</td>${sizes.map((size,i)=>`<td><div class="variant-control"><button type="button" class="small" ${row[i]<=0?'disabled':''} data-act="variant-dec" data-color="${esc(color)}" data-size="${size}" aria-label="Reduce ${esc(color)} size ${size}">−</button><span>${row[i]}</span><button type="button" class="small" data-act="variant-inc" data-color="${esc(color)}" data-size="${size}" aria-label="Increase ${esc(color)} size ${size}">+</button></div></td>`).join('')}<td class="variant-total">${row.reduce((a,b)=>a+b,0)}</td></tr>`}).join('')}</tbody></table></div><div class="detail-actions"><button type="button" class="icon-action receive" data-act="receive" aria-label="Receive stock" title="Receive stock"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3.5 7.3 12 11.5l8.5-4.2L12 3Z"/><path d="M3.5 7.3v9.4L12 21l8.5-4.3V7.3M12 11.5V21"/><path d="M16 3v5m-2.5-2.5h5"/></svg><span class="sr-only">Receive stock</span></button><button type="button" class="icon-action edit" data-act="edit" aria-label="Edit product" title="Edit product"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M4 20l4.2-.9L19.4 7.9a2.1 2.1 0 0 0-3-3L5.2 16.1 4 20Z"/><path d="M13 20h7"/></svg><span class="sr-only">Edit product</span></button><button type="button" class="icon-action history" data-act="history" aria-label="View stock history" title="View stock history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/><path d="M4.8 5.5 3 7.3"/></svg><span class="sr-only">View stock history</span></button><button type="button" class="icon-action delete" data-act="del" aria-label="Delete product" title="Delete product"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m3 3v7m6-7v7"/></svg><span class="sr-only">Delete product</span></button></div><div class="hint" id="history"></div></div>`;
}$("#list").addEventListener("click",e=>{const row=e.target.closest('tr[data-id]');if(!row)return;selectedId=row.dataset.id;renderTable();renderDetail(products.find(p=>p.id===selectedId));$("#detail [data-act=close]").focus();});
$("#detail").addEventListener("click",async e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,p=products.find(x=>x.id===selectedId);if(!p)return;
 if(act==='variant-inc'||act==='variant-dec'){await stock(p.id,{color:b.dataset.color,size:b.dataset.size,delta:act==='variant-inc'?1:-1},b);return}
 if(act==='close'){closeDetail();return}
 if(act==='edit')openForm(p);
 if(act==='del'){if(!confirm(`Delete "${p.name}"? This also removes its photos and can't be undone.`))return;try{await api(`/api/admin/products/${p.id}`,{method:'DELETE'});products=products.filter(x=>x.id!==p.id);selectedId=null;render();toast('Deleted')}catch(err){toast(err.message,true)}}
 if(act==='receive'){$("#history").innerHTML=`<form id="receiveForm" class="row" style="margin-top:14px"><label style="margin:0">Color<select name="color">${(p.colors||['Standard']).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></label><label style="margin:0">Size<select name="size">${Array.from({length:p.sizeMax-p.sizeMin+1},(_,i)=>String(p.sizeMin+i)).map(s=>`<option value="${s}">${s}</option>`).join('')}</select></label><label style="margin:0">Pairs received<input name="amount" type="number" min="1" step="1" required placeholder="e.g. 5"></label><button class="btn dark" type="submit">Add stock</button></form>`}
 if(act==='history'){const h=p.stockHistory||[];$("#history").innerHTML=h.length?`<b>Recent stock changes</b><br>${h.slice().reverse().slice(0,12).map(x=>`${esc(x.color||'Legacy')} · size ${esc(x.size)} · ${x.quantity>0?'+':''}${x.quantity} (${esc(x.reason||'stock change')}) · ${new Date(x.createdAt).toLocaleString()}`).join('<br>')}`:'No stock changes recorded yet.'}
});
$("#detail").addEventListener("submit",async e=>{if(e.target.id!=='receiveForm')return;e.preventDefault();const data=new FormData(e.target);await stock(selectedId,{color:data.get('color'),size:data.get('size'),delta:Number(data.get('amount'))},e.submitter)});
async function stock(id,body,button){if(button){button.disabled=true;button.classList.add('is-loading')}try{const p=await api(`/api/admin/products/${id}/stock`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});products=products.map(x=>x.id===id?p:x);render();toast('Stock saved')}catch(err){toast(err.message,true);load()}finally{if(button){button.disabled=false;button.classList.remove('is-loading')}}}
function clearPreviewUrls() {
  previewUrls.forEach(URL.revokeObjectURL);
  previewUrls = [];
}
function showPreview(images) {
  const pv = $("#preview");
  pv.replaceChildren();
  if (!images.length) {
    const empty = document.createElement("div");
    empty.className = "preview-empty";
    empty.textContent = "No photos chosen";
    pv.append(empty);
    return;
  }
  images.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.alt = "Product photo preview";
    pv.append(img);
  });
}
function previewImg() {
  clearPreviewUrls();
  const files = Array.from($("#images").files);
  if (files.length > 12) {
    $("#formErr").textContent = "Choose no more than 12 product photos.";
    $("#images").value = "";
    showPreview(currentProductImages());
    return;
  }
  if (files.reduce((total, file) => total + file.size, 0) > 4 * 1024 * 1024) {
    $("#formErr").textContent = "Product photos must total no more than 4MB.";
    $("#images").value = "";
    showPreview(currentProductImages());
    return;
  }
  $("#formErr").textContent = "";
  previewUrls = files.map(file => URL.createObjectURL(file));
  showPreview(previewUrls);
}
function currentProductImages() {
  const product = products.find(p => p.id === editingId);
  return product ? (product.images && product.images.length ? product.images : [product.image].filter(Boolean)) : [];
}
function openForm(p) {
  editingId = p ? p.id : null;
  clearPreviewUrls();
  $("#form").reset(); $("#formErr").textContent = "";
  $("#formTitle").textContent = p ? "Edit product" : "Add product";
  $("#name").value = p ? p.name : ""; $("#type").value = p ? p.type : "";
  $("#price").value = p && p.price != null ? p.price : ""; $("#desc").value = p ? p.desc : "";
  $("#colors").value = p ? p.colors.join(", ") : "";
  $("#sizeMin").value = p ? p.sizeMin : 43; $("#sizeMax").value = p ? p.sizeMax : 48;
  $("#quantity").value = p ? p.quantity : 0; $("#available").checked = p ? p.available : true;
  showPreview(currentProductImages());
  $("#formModal").classList.add("open");
}
function closeForm() { clearPreviewUrls(); $("#formModal").classList.remove("open"); }

async function saveProduct(e) {
  e.preventDefault(); $("#formErr").textContent = "";
  const images = Array.from($("#images").files);
  if (!editingId && !images.length) { $("#formErr").textContent = "Please choose at least one product photo."; return; }
  if (images.length > 12) { $("#formErr").textContent = "Choose no more than 12 product photos."; return; }
  if (images.reduce((total, file) => total + file.size, 0) > 4 * 1024 * 1024) { $("#formErr").textContent = "Product photos must total no more than 4MB."; return; }
  const fd = new FormData();
  for (const k of ["name", "type", "price", "desc", "colors", "sizeMin", "sizeMax", "quantity"]) fd.append(k, $("#" + k).value);
  fd.append("available", $("#available").checked);
  images.forEach(image => fd.append("images", image));
  const btn = $("#saveBtn"); btn.disabled = true; btn.classList.add("is-loading"); btn.textContent = "Saving…";
  try {
    await api(editingId ? `/api/admin/products/${editingId}` : "/api/admin/products", { method: editingId ? "PUT" : "POST", body: fd });
    closeForm(); await load(); toast("Saved");
  } catch (err) { $("#formErr").textContent = err.message; }
  finally { btn.disabled = false; btn.classList.remove("is-loading"); btn.textContent = "Save product"; }
}

(async () => { try { await api("/api/admin/me"); if (showApp()) load(); } catch { showLogin(); } })();
</script>
<script src="/admin-notifications.js"></script>
</body>
</html>
