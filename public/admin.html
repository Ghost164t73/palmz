<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PALMZ Admin</title>
<style>
:root{color-scheme:light;--bg:#f7f5ef;--surface:#fff;--surface2:#f1efe8;--text:#11141c;--muted:#6e6d68;--line:rgba(17,20,28,.12);--navy:#0c1227;--gold:#c9a34a;--red:#b3261e;--green:#1f8a4c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.wrap{width:min(1100px,calc(100% - 28px));margin:auto}
.top{background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{font-weight:900;letter-spacing:.2em}
.brand small{color:var(--gold);letter-spacing:.12em;margin-left:8px;font-weight:700}
.top a,.top button{color:#e9e6da;font-size:13px;background:none;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 14px;text-decoration:none}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:var(--gold);color:#111}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.6;cursor:wait}
.login{max-width:380px;margin:90px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px}
.login h1{margin:0 0 6px;font:700 28px Georgia,serif}
.login p{color:var(--muted);font-size:13px;margin:0 0 18px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:12px}
label input,label textarea,label select{margin-top:5px;font-weight:400;color:var(--text)}
.err{color:var(--red);font-size:12px;min-height:16px;margin-top:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 16px;flex-wrap:wrap}
.bar h2{margin:0;font:700 30px Georgia,serif}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:120px}
.stat b{display:block;font-size:22px}
.stat span{font-size:11px;color:var(--muted)}
.list{display:grid;gap:12px;padding-bottom:60px}
.item{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.item img{width:84px;height:84px;object-fit:cover;border-radius:12px;background:var(--surface2)}
.item h3{margin:0 0 4px;font-size:15px}
.meta{font-size:12px;color:var(--muted);line-height:1.6}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;margin-left:6px;color:#fff;vertical-align:middle}
.chip.ok{background:var(--green)}.chip.out{background:var(--red)}.chip.off{background:#888}.chip.low{background:var(--gold);color:#111}
.ctrl{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.row{display:flex;gap:8px;align-items:center}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface2)}
.stepper button{width:32px;height:32px;border:0;background:none;font-size:16px}
.stepper input{width:54px;text-align:center;border:0;background:none;padding:6px 0;border-radius:0}
.switch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer}
.switch input{width:auto;accent-color:var(--navy)}
.small{padding:7px 12px;font-size:12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.small.del{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:60px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px;z-index:50}
.modal.open{display:grid}
.box{width:min(620px,100%);max-height:94vh;overflow:auto;background:var(--surface);border-radius:22px;padding:22px}
.box h3{margin:0 0 4px;font:700 26px Georgia,serif}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:5px}
.preview-gallery img,.preview-empty{width:100%;height:100px;border:1px dashed var(--line);border-radius:10px;background:var(--surface2);object-fit:cover}
.preview-empty{display:grid;place-items:center;color:var(--muted);font-size:12px}
.hint{font-size:11px;color:var(--muted);margin-top:4px;font-weight:400}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--text);font-weight:600}
.check input{width:auto;margin:0}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-size:12px;font-weight:800;transition:.2s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--red)}
@media(max-width:640px){.item{grid-template-columns:70px 1fr}.item img{width:70px;height:70px}.ctrl{grid-column:1/-1;flex-direction:row;justify-content:space-between;flex-wrap:wrap;align-items:center}.two{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginView" style="display:none">
  <form class="login" onsubmit="login(event)">
    <h1>PALMZ Admin</h1>
    <p>Sign in to manage your palms, sizes and stock.</p>
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn dark" style="width:100%;margin-top:6px" type="submit">Sign in</button>
  </form>
</div>

<div id="appView" style="display:none">
  <div class="top"><div class="wrap">
    <div class="brand">PALMZ<small>ADMIN</small></div>
    <div class="row"><a href="/" target="_blank">View store</a><button onclick="logout()">Sign out</button></div>
  </div></div>
  <div class="wrap">
    <div class="bar"><h2>Your palms</h2><button class="btn" onclick="openForm()">+ Add palm</button></div>
    <div class="stats" id="stats"></div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="modal" id="formModal" onclick="if(event.target===this)closeForm()">
  <form class="box" id="form" onsubmit="saveProduct(event)">
    <h3 id="formTitle">Add palm</h3>
    <label>Product photos <span class="hint">(up to 12 images, 4MB total; upload in the order customers should browse. New photos replace the current gallery.)</span>
      <div class="preview-gallery" id="preview"><div class="preview-empty">No photos chosen</div></div>
      <input type="file" id="images" accept="image/jpeg,image/png,image/webp" multiple onchange="previewImg()">
    </label>
    <label>Name<input id="name" required maxlength="80" placeholder="e.g. Signature Cross"></label>
    <div class="two">
      <label>Category <span class="hint">(used for the store filters)</span><input id="type" list="types" maxlength="40" placeholder="e.g. Cross Strap"><datalist id="types"></datalist></label>
      <label>Price (₦) <span class="hint">(leave empty = "Price via WhatsApp")</span><input id="price" type="number" min="0" step="1"></label>
    </div>
    <label>Description<textarea id="desc" rows="2" maxlength="400"></textarea></label>
    <label>Colours / variants <span class="hint">(separate with commas)</span><input id="colors" placeholder="e.g. Navy / Black, Tan"></label>
    <div class="two">
      <label>Smallest size<input id="sizeMin" type="number" min="20" max="60" step="1" required value="43"></label>
      <label>Largest size<input id="sizeMax" type="number" min="20" max="60" step="1" required value="48"></label>
    </div>
    <div class="two">
      <label>Quantity remaining<input id="quantity" type="number" min="0" step="1" required value="0"></label>
      <div></div>
    </div>
    <label class="check"><input type="checkbox" id="available" checked> Available for sale</label>
    <div class="err" id="formErr"></div>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeForm()">Cancel</button><button class="btn dark" id="saveBtn" type="submit">Save palm</button></div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let products = [], editingId = null;
let previewUrls = [];

function toast(t, bad) { const el = $("#toast"); el.textContent = t; el.className = "toast show" + (bad ? " bad" : ""); clearTimeout(window.__t); window.__t = setTimeout(() => el.classList.remove("show"), 2200); }
function showLogin() { $("#appView").style.display = "none"; $("#loginView").style.display = "block"; }
function showApp() { $("#loginView").style.display = "none"; $("#appView").style.display = "block"; }

async function api(url, opts = {}) {
  const r = await fetch(url, { credentials: "same-origin", ...opts });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && !url.includes("/login")) { showLogin(); throw new Error("Please sign in again"); }
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
}

async function login(e) {
  e.preventDefault(); $("#loginErr").textContent = "";
  try {
    await api("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("#pw").value }) });
    $("#pw").value = ""; showApp(); load();
  } catch (err) { $("#loginErr").textContent = err.message; }
}
async function logout() { await fetch("/api/admin/logout", { method: "POST" }); showLogin(); }

async function load() {
  try { products = (await api("/api/products")).products; render(); }
  catch (err) { toast(err.message, true); }
}

function status(p) {
  if (!p.available) return '<span class="chip off">Hidden / unavailable</span>';
  if (p.quantity === 0) return '<span class="chip out">Sold out</span>';
  if (p.quantity <= 5) return '<span class="chip low">Low stock</span>';
  return '<span class="chip ok">Available</span>';
}

function render() {
  const live = products.filter(p => p.inStock).length;
  $("#stats").innerHTML = `<div class="stat"><b>${products.length}</b><span>Total palms</span></div><div class="stat"><b>${live}</b><span>On sale now</span></div><div class="stat"><b>${products.length - live}</b><span>Sold out / off</span></div>`;
  $("#types").innerHTML = [...new Set(products.map(p => p.type))].map(t => `<option value="${esc(t)}">`).join("");
  $("#list").innerHTML = products.length ? products.map(p => `
    <div class="item" data-id="${p.id}">
      <img src="${esc(p.image)}" alt="">
      <div>
        <h3>${esc(p.name)} ${status(p)}</h3>
        <div class="meta">${esc(p.type)} · Sizes ${p.sizeMin}–${p.sizeMax} · ${p.price != null ? "₦" + Number(p.price).toLocaleString("en-NG") : "Price via WhatsApp"}<br>${p.colors.map(esc).join(", ")}</div>
      </div>
      <div class="ctrl">
        <div class="row">
          <div class="stepper"><button data-act="dec" aria-label="Less">−</button><input data-act="qty" type="number" min="0" value="${p.quantity}" aria-label="Quantity remaining"><button data-act="inc" aria-label="More">+</button></div>
          <label class="switch" style="margin:0"><input data-act="avail" type="checkbox" ${p.available ? "checked" : ""}> Available</label>
        </div>
        <div class="row"><button class="small" data-act="edit">Edit</button><button class="small del" data-act="del">Delete</button></div>
      </div>
    </div>`).join("") : '<div class="empty">No palms yet. Click <b>+ Add palm</b> to create your first one.</div>';
}

async function stock(id, body) {
  try {
    const p = await api(`/api/admin/products/${id}/stock`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    products = products.map(x => x.id === id ? p : x); render(); toast("Saved");
  } catch (err) { toast(err.message, true); load(); }
}

$("#list").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.closest(".item").dataset.id, act = b.dataset.act;
  if (act === "dec") stock(id, { delta: -1 });
  else if (act === "inc") stock(id, { delta: 1 });
  else if (act === "edit") openForm(products.find(p => p.id === id));
  else if (act === "del") {
    const p = products.find(x => x.id === id);
    if (!confirm(`Delete "${p.name}"? This also removes its photos and can't be undone.`)) return;
    try { await api(`/api/admin/products/${id}`, { method: "DELETE" }); products = products.filter(x => x.id !== id); render(); toast("Deleted"); }
    catch (err) { toast(err.message, true); }
  }
});
$("#list").addEventListener("change", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.closest(".item").dataset.id;
  if (b.dataset.act === "qty") stock(id, { quantity: Math.max(0, parseInt(b.value, 10) || 0) });
  if (b.dataset.act === "avail") stock(id, { available: b.checked });
});

function clearPreviewUrls() {
  previewUrls.forEach(URL.revokeObjectURL);
  previewUrls = [];
}
function showPreview(images) {
  const pv = $("#preview");
  pv.replaceChildren();
  if (!images.length) {
    const empty = document.createElement("div");
    empty.className = "preview-empty";
    empty.textContent = "No photos chosen";
    pv.append(empty);
    return;
  }
  images.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.alt = "Product photo preview";
    pv.append(img);
  });
}
function previewImg() {
  clearPreviewUrls();
  const files = Array.from($("#images").files);
  if (files.length > 12) {
    $("#formErr").textContent = "Choose no more than 12 product photos.";
    $("#images").value = "";
    showPreview(currentProductImages());
    return;
  }
  if (files.reduce((total, file) => total + file.size, 0) > 4 * 1024 * 1024) {
    $("#formErr").textContent = "Product photos must total no more than 4MB.";
    $("#images").value = "";
    showPreview(currentProductImages());
    return;
  }
  $("#formErr").textContent = "";
  previewUrls = files.map(file => URL.createObjectURL(file));
  showPreview(previewUrls);
}
function currentProductImages() {
  const product = products.find(p => p.id === editingId);
  return product ? (product.images && product.images.length ? product.images : [product.image].filter(Boolean)) : [];
}
function openForm(p) {
  editingId = p ? p.id : null;
  clearPreviewUrls();
  $("#form").reset(); $("#formErr").textContent = "";
  $("#formTitle").textContent = p ? "Edit palm" : "Add palm";
  $("#name").value = p ? p.name : ""; $("#type").value = p ? p.type : "";
  $("#price").value = p && p.price != null ? p.price : ""; $("#desc").value = p ? p.desc : "";
  $("#colors").value = p ? p.colors.join(", ") : "";
  $("#sizeMin").value = p ? p.sizeMin : 43; $("#sizeMax").value = p ? p.sizeMax : 48;
  $("#quantity").value = p ? p.quantity : 0; $("#available").checked = p ? p.available : true;
  showPreview(currentProductImages());
  $("#formModal").classList.add("open");
}
function closeForm() { clearPreviewUrls(); $("#formModal").classList.remove("open"); }

async function saveProduct(e) {
  e.preventDefault(); $("#formErr").textContent = "";
  const images = Array.from($("#images").files);
  if (!editingId && !images.length) { $("#formErr").textContent = "Please choose at least one product photo."; return; }
  if (images.length > 12) { $("#formErr").textContent = "Choose no more than 12 product photos."; return; }
  if (images.reduce((total, file) => total + file.size, 0) > 4 * 1024 * 1024) { $("#formErr").textContent = "Product photos must total no more than 4MB."; return; }
  const fd = new FormData();
  for (const k of ["name", "type", "price", "desc", "colors", "sizeMin", "sizeMax", "quantity"]) fd.append(k, $("#" + k).value);
  fd.append("available", $("#available").checked);
  images.forEach(image => fd.append("images", image));
  const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "Saving...";
  try {
    await api(editingId ? `/api/admin/products/${editingId}` : "/api/admin/products", { method: editingId ? "PUT" : "POST", body: fd });
    closeForm(); await load(); toast("Saved");
  } catch (err) { $("#formErr").textContent = err.message; }
  finally { btn.disabled = false; btn.textContent = "Save palm"; }
}

(async () => { try { await api("/api/admin/me"); showApp(); load(); } catch { showLogin(); } })();
</script>
</body>
</html>
