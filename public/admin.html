<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PALMZ Admin</title>
<style>
:root{color-scheme:light;--bg:#f7f5ef;--surface:#fff;--surface2:#f1efe8;--text:#11141c;--muted:#6e6d68;--line:rgba(17,20,28,.12);--navy:#0c1227;--gold:#c9a34a;--red:#b3261e;--green:#1f8a4c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.wrap{width:min(1100px,calc(100% - 28px));margin:auto}
.top{background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{font-weight:900;letter-spacing:.2em}
.brand small{color:var(--gold);letter-spacing:.12em;margin-left:8px;font-weight:700}
.top a,.top button{color:#e9e6da;font-size:13px;background:none;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 14px;text-decoration:none}
.top .menu-toggle{width:42px;height:42px;padding:10px;display:grid;align-content:center;gap:5px;border-radius:12px}
.menu-toggle span{height:2px;background:currentColor;border-radius:2px}
.drawer-backdrop{position:fixed;inset:0;z-index:60;border:0;background:rgba(5,9,20,.5);opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
.drawer-backdrop.open{opacity:1;visibility:visible}
.admin-drawer{position:fixed;z-index:61;inset:0 0 0 auto;width:min(330px,86vw);padding:22px;background:var(--navy);color:#fff;transform:translateX(102%);transition:transform .25s ease;box-shadow:-14px 0 40px rgba(0,0,0,.2)}
.admin-drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.14)}
.drawer-title{font-weight:900;letter-spacing:.18em}.drawer-title small{display:block;margin-top:5px;color:var(--gold);font-size:10px;letter-spacing:.14em}
.drawer-close{width:38px;height:38px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:none;color:#fff;font-size:23px;line-height:1}
.drawer-links{display:grid;gap:8px;padding:20px 0}
.drawer-links a,.drawer-links button{display:block;width:100%;padding:13px 14px;border:0;border-radius:11px;background:transparent;color:#eeece5;text-align:left;text-decoration:none;font-size:14px}
.drawer-links a:hover,.drawer-links a[aria-current="page"],.drawer-links button:hover{background:rgba(255,255,255,.09)}
.drawer-links a[aria-current="page"]{color:var(--gold);font-weight:800}
body.menu-open{overflow:hidden}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:var(--gold);color:#111}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.6;cursor:wait}
.login{max-width:380px;margin:90px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px}
.login h1{margin:0 0 6px;font:700 28px Georgia,serif}
.login p{color:var(--muted);font-size:13px;margin:0 0 18px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:12px}
label input,label textarea,label select{margin-top:5px;font-weight:400;color:var(--text)}
.err{color:var(--red);font-size:12px;min-height:16px;margin-top:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 16px;flex-wrap:wrap}
.bar h2{margin:0;font:700 30px Georgia,serif}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:120px}
.stat b{display:block;font-size:22px}
.stat span{font-size:11px;color:var(--muted)}
.list{display:grid;gap:12px;padding-bottom:60px}
.item{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.item img{width:84px;height:84px;object-fit:cover;border-radius:12px;background:var(--surface2)}
.item h3{margin:0 0 4px;font-size:15px}
.meta{font-size:12px;color:var(--muted);line-height:1.6}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;margin-left:6px;color:#fff;vertical-align:middle}
.chip.ok{background:var(--green)}.chip.out{background:var(--red)}.chip.off{background:#888}.chip.low{background:var(--gold);color:#111}
.ctrl{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.row{display:flex;gap:8px;align-items:center}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface2)}
.stepper button{width:32px;height:32px;border:0;background:none;font-size:16px}
.stepper input{width:54px;text-align:center;border:0;background:none;padding:6px 0;border-radius:0}
.switch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer}
.switch input{width:auto;accent-color:var(--navy)}
.small{padding:7px 12px;font-size:12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.small.del{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:60px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px;z-index:50}
.modal.open{display:grid}
.box{width:min(620px,100%);max-height:94vh;overflow:auto;background:var(--surface);border-radius:22px;padding:22px}
.box h3{margin:0 0 4px;font:700 26px Georgia,serif}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:5px}
.preview-gallery img,.preview-empty{width:100%;height:100px;border:1px dashed var(--line);border-radius:10px;background:var(--surface2);object-fit:cover}
.preview-empty{display:grid;place-items:center;color:var(--muted);font-size:12px}
.hint{font-size:11px;color:var(--muted);margin-top:4px;font-weight:400}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--text);font-weight:600}
.check input{width:auto;margin:0}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-size:12px;font-weight:800;transition:.2s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--red)}
.inventory-tools{display:grid;grid-template-columns:minmax(220px,1fr) 180px 180px;gap:10px;margin:18px 0}
.table-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:24px}
table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;background:#faf9f5}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.selected{background:#f7f3e8}tbody tr:last-child td{border:0}.product-cell{display:flex;align-items:center;gap:12px;font-weight:750}.product-cell img{width:42px;height:42px;object-fit:cover;border-radius:9px;background:var(--surface2)}
.detail{display:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 40px;scroll-margin-top:18px}.detail.open{display:block}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.detail h3{margin:0;font-size:18px}.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.size-stock{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 13px;font-size:12px}.size-stock b{display:block;font-size:16px;margin-top:3px}.detail-actions{display:flex;gap:8px;flex-wrap:wrap}.detail .hint{margin-top:12px}.matrix{width:100%;min-width:0;margin:12px 0 16px}.matrix th,.matrix td{padding:10px;text-align:center}.matrix th:first-child,.matrix td:first-child{text-align:left}.variant-total{font-weight:800}.variant-control{display:flex;align-items:center;justify-content:center;gap:6px}.variant-control button{width:25px;height:25px;padding:0;line-height:1}.variant-control span{min-width:18px;font-weight:750}
@media(max-width:640px){.inventory-tools{grid-template-columns:1fr 1fr}.inventory-tools input{grid-column:1/-1}.bar h2{font-size:26px}}
@media(max-width:640px){.item{grid-template-columns:70px 1fr}.item img{width:70px;height:70px}.ctrl{grid-column:1/-1;flex-direction:row;justify-content:space-between;flex-wrap:wrap;align-items:center}.two{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginView" style="display:none">
  <form class="login" onsubmit="login(event)">
    <h1>PALMZ Admin</h1>
    <p>Sign in to manage your palms, sizes and stock.</p>
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn dark" style="width:100%;margin-top:6px" type="submit">Sign in</button>
  </form>
</div>

<div id="appView" style="display:none">
  <div class="top"><div class="wrap">
    <div class="brand">PALMZ<small>ADMIN</small></div>
    <button class="menu-toggle" type="button" aria-label="Open admin navigation" aria-expanded="false" aria-controls="adminDrawer" onclick="toggleAdminMenu(true)"><span></span><span></span><span></span></button>
  </div></div>
  <div class="wrap">
    <div class="bar"><h2>Inventory</h2><button class="btn" onclick="openForm()">+ Add product</button></div>
    <div class="stats" id="stats"></div>
    <div class="inventory-tools"><input id="search" placeholder="Search products…" oninput="renderTable()"><select id="category" onchange="renderTable()"><option value="">All categories</option></select><select id="stockFilter" onchange="renderTable()"><option value="">All stock statuses</option><option value="In stock">In stock</option><option value="Low stock">Low stock</option><option value="Sold out">Sold out</option><option value="Unavailable">Unavailable</option></select></div>
    <div class="table-wrap"><table><thead><tr><th>Product</th><th>Variant</th><th>Size</th><th>Stock</th><th>Status</th></tr></thead><tbody id="list"></tbody></table></div>
    <section class="detail" id="detail"></section>
  </div>
</div>

<button class="drawer-backdrop" id="drawerBackdrop" type="button" aria-label="Close navigation" onclick="toggleAdminMenu(false)"></button>
<aside class="admin-drawer" id="adminDrawer" aria-label="Admin navigation" aria-hidden="true" inert>
  <div class="drawer-head"><div class="drawer-title">PALMZ<small>ADMIN MENU</small></div><button class="drawer-close" type="button" aria-label="Close navigation" onclick="toggleAdminMenu(false)">×</button></div>
  <nav class="drawer-links">
    <a href="/admin" aria-current="page">Inventory</a>
    <a href="/admin/orders">Orders</a>
    <a href="/admin/sales">Sales history</a>
    <a href="/" target="_blank" rel="noopener">View store ↗</a>
    <button type="button" onclick="logout()">Sign out</button>
  </nav>
</aside>

<div class="modal" id="formModal" onclick="if(event.target===this)closeForm()">
  <form class="box" id="form" onsubmit="saveProduct(event)">
    <h3 id="formTitle">Add product</h3>
    <label>Product photos <span class="hint">(up to 12 images, 4MB total; upload in the order customers should browse. New photos replace the current gallery.)</span>
      <div class="preview-gallery" id="preview"><div class="preview-empty">No photos chosen</div></div>
      <input type="file" id="images" accept="image/jpeg,image/png,image/webp" multiple onchange="previewImg()">
    </label>
    <label>Name<input id="name" required maxlength="80" placeholder="e.g. Signature Cross"></label>
    <div class="two">
      <label>Category <span class="hint">(used for the store filters)</span><input id="type" list="types" maxlength="40" placeholder="e.g. Cross Strap"><datalist id="types"></datalist></label>
      <label>Price (₦) <span class="hint">(leave empty = "Price via WhatsApp")</span><input id="price" type="number" min="0" step="1"></label>
    </div>
    <label>Description<textarea id="desc" rows="2" maxlength="400"></textarea></label>
    <label>Colours / variants <span class="hint">(separate with commas)</span><input id="colors" placeholder="e.g. Navy / Black, Tan"></label>
    <div class="two">
      <label>Smallest size<input id="sizeMin" type="number" min="20" max="60" step="1" required value="43"></label>
      <label>Largest size<input id="sizeMax" type="number" min="20" max="60" step="1" required value="48"></label>
    </div>
    <div class="two"><label>Opening stock<input id="quantity" type="number" min="0" step="1" required value="0"></label><div class="hint" style="align-self:center">Opening stock is distributed evenly across the selected sizes.</div></div>
    <label class="check"><input type="checkbox" id="available" checked> Available for sale</label>
    <div class="err" id="formErr"></div>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeForm()">Cancel</button><button class="btn dark" id="saveBtn" type="submit">Save product</button></div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let products = [], editingId = null, selectedId = null;
let previewUrls = [];

function toast(t, bad) { const el = $("#toast"); el.textContent = t; el.className = "toast show" + (bad ? " bad" : ""); clearTimeout(window.__t); window.__t = setTimeout(() => el.classList.remove("show"), 2200); }
function showLogin() { $("#appView").style.display = "none"; $("#loginView").style.display = "block"; }
function showApp() {
  if (new URLSearchParams(location.search).get("next") === "orders") {
    location.replace("/admin/orders");
    return false;
  }
  $("#loginView").style.display = "none"; $("#appView").style.display = "block";
  return true;
}

async function api(url, opts = {}) {
  const r = await fetch(url, { credentials: "same-origin", ...opts });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && !url.includes("/login")) { showLogin(); throw new Error("Please sign in again"); }
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
}

async function login(e) {
  e.preventDefault(); $("#loginErr").textContent = "";
  try {
    await api("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("#pw").value }) });
    $("#pw").value = ""; if (showApp()) load();
  } catch (err) { $("#loginErr").textContent = err.message; }
}
async function logout() { toggleAdminMenu(false); await fetch("/api/admin/logout", { method: "POST" }); showLogin(); }
function toggleAdminMenu(open) {
  const drawer = $("#adminDrawer"), backdrop = $("#drawerBackdrop"), toggle = $(".menu-toggle");
  drawer.classList.toggle("open", open); backdrop.classList.toggle("open", open);
  drawer.setAttribute("aria-hidden", String(!open)); drawer.inert = !open; toggle.setAttribute("aria-expanded", String(open));
  document.body.classList.toggle("menu-open", open);
  if (open) $(".drawer-close").focus(); else toggle.focus();
}
document.addEventListener("keydown", event => { if (event.key === "Escape" && $("#adminDrawer").classList.contains("open")) toggleAdminMenu(false); });

async function load() {
  try { products = (await api("/api/products")).products; render(); }
  catch (err) { toast(err.message, true); }
}

function variantKey(color,size){return `${encodeURIComponent(String(color)).replace(/\./g,'%2E')}__${size}`}
function variantQuantities(p){
 const raw=p.stockByVariant||{};if(Object.keys(raw).length)return raw;
 const colors=p.colors&&p.colors.length?p.colors:['Standard'],sizes=Array.from({length:p.sizeMax-p.sizeMin+1},(_,i)=>String(p.sizeMin+i)),out={},legacy=p.stockBySize||{};
 if(Object.keys(legacy).length){sizes.forEach(size=>{const count=Number(legacy[size]||0);colors.forEach((color,i)=>out[variantKey(color,size)]=Math.floor(count/colors.length)+(i<count%colors.length?1:0))})}
 else{const combinations=colors.length*sizes.length,each=Math.floor((p.quantity||0)/combinations),rem=(p.quantity||0)%combinations;let i=0;colors.forEach(color=>sizes.forEach(size=>out[variantKey(color,size)]=each+(i++<rem?1:0)))}
 return out;
}
function total(p){return Object.values(variantQuantities(p)).reduce((a,b)=>a+Number(b||0),0)}function stockStatus(p){const n=total(p);return !p.available?'Unavailable':n===0?'Sold out':n<=5?'Low stock':'In stock'}
function badge(s){return `<span class="chip ${s==='In stock'?'ok':s==='Low stock'?'low':s==='Sold out'?'out':'off'}">${s}</span>`}
function render(){
 const sum=products.reduce((a,p)=>a+total(p),0);
 $("#stats").innerHTML=`<div class="stat"><b>${products.length}</b><span>Products</span></div><div class="stat"><b>${sum}</b><span>Pairs in stock</span></div><div class="stat"><b>${products.filter(p=>stockStatus(p)==='Low stock').length}</b><span>Low stock</span></div><div class="stat"><b>${products.filter(p=>stockStatus(p)==='Sold out').length}</b><span>Sold out</span></div>`;
 $("#types").innerHTML=[...new Set(products.map(p=>p.type))].map(t=>`<option value="${esc(t)}">`).join("");
 const sel=$("#category"), old=sel.value;sel.innerHTML='<option value="">All categories</option>'+[...new Set(products.map(p=>p.type))].map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');sel.value=old;
 renderTable(); if(selectedId&&products.some(p=>p.id===selectedId))renderDetail(products.find(p=>p.id===selectedId));else{$("#detail").classList.remove('open');selectedId=null}
}
function renderTable(){
 const q=$("#search").value.toLowerCase(),cat=$("#category").value,f=$("#stockFilter").value;
 const rows=products.filter(p=>(!q||`${p.name} ${p.type} ${(p.colors||[]).join(' ')}`.toLowerCase().includes(q))&&(!cat||p.type===cat)&&(!f||stockStatus(p)===f));
 $("#list").innerHTML=rows.length?rows.map(p=>`<tr data-id="${p.id}" class="${selectedId===p.id?'selected':''}"><td><div class="product-cell"><img src="${esc(p.image)}" alt=""><span>${esc(p.name)}</span></div></td><td>${(p.colors||[]).map(esc).join(', ')}</td><td>${p.sizeMin}–${p.sizeMax}</td><td><b>${total(p)}</b></td><td>${badge(stockStatus(p))}</td></tr>`).join(''):`<tr><td colspan="5" class="empty">${products.length?'No products match these filters.':'No products yet. Add your first product.'}</td></tr>`;
}
function renderDetail(p){
 const d=$("#detail"),q=variantQuantities(p),colors=p.colors&&p.colors.length?p.colors:['Standard'],sizes=Array.from({length:p.sizeMax-p.sizeMin+1},(_,i)=>String(p.sizeMin+i));d.classList.add('open');
 d.innerHTML=`<div class="detail-head"><h3>${esc(p.name)} · ${esc(p.type)}</h3><button class="small" data-act="close">Close</button></div><div class="meta">Stock by color and size · adjust each variant here</div><div class="table-wrap"><table class="matrix"><thead><tr><th>Color</th>${sizes.map(s=>`<th>${s}</th>`).join('')}<th>Total</th></tr></thead><tbody>${colors.map(color=>{const row=sizes.map(size=>Number(q[variantKey(color,size)]||0));return `<tr><td>${esc(color)}</td>${sizes.map((size,i)=>`<td><div class="variant-control"><button type="button" class="small" ${row[i]<=0?'disabled':''} data-act="variant-dec" data-color="${esc(color)}" data-size="${size}" aria-label="Reduce ${esc(color)} size ${size}">−</button><span>${row[i]}</span><button type="button" class="small" data-act="variant-inc" data-color="${esc(color)}" data-size="${size}" aria-label="Increase ${esc(color)} size ${size}">+</button></div></td>`).join('')}<td class="variant-total">${row.reduce((a,b)=>a+b,0)}</td></tr>`}).join('')}</tbody></table></div><div class="detail-actions"><button class="btn" data-act="receive">+ Receive stock</button><button class="btn dark" data-act="edit">Edit product</button><button class="btn ghost" data-act="history">View history</button><button class="small del" data-act="del">Delete product</button></div><div class="hint" id="history"></div>`;
}$("#list").addEventListener("click",e=>{const row=e.target.closest('tr[data-id]');if(!row)return;selectedId=row.dataset.id;renderTable();renderDetail(products.find(p=>p.id===selectedId));$("#detail").scrollIntoView({behavior:'smooth',block:'start'});});
$("#detail").addEventListener("click",async e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,p=products.find(x=>x.id===selectedId);if(!p)return;
 if(act==='variant-inc'||act==='variant-dec'){await stock(p.id,{color:b.dataset.color,size:b.dataset.size,delta:act==='variant-inc'?1:-1});return}
 if(act==='close'){selectedId=null;$("#detail").classList.remove('open');renderTable()}
 if(act==='edit')openForm(p);
 if(act==='del'){if(!confirm(`Delete "${p.name}"? This also removes its photos and can't be undone.`))return;try{await api(`/api/admin/products/${p.id}`,{method:'DELETE'});products=products.filter(x=>x.id!==p.id);selectedId=null;render();toast('Deleted')}catch(err){toast(err.message,true)}}
 if(act==='receive'){$("#history").innerHTML=`<form id="receiveForm" class="row" style="margin-top:14px"><label style="margin:0">Color<select name="color">${(p.colors||['Standard']).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></label><label style="margin:0">Size<select name="size">${Array.from({length:p.sizeMax-p.sizeMin+1},(_,i)=>String(p.sizeMin+i)).map(s=>`<option value="${s}">${s}</option>`).join('')}</select></label><label style="margin:0">Pairs received<input name="amount" type="number" min="1" step="1" required placeholder="e.g. 5"></label><button class="btn dark" type="submit">Add stock</button></form>`}
 if(act==='history'){const h=p.stockHistory||[];$("#history").innerHTML=h.length?`<b>Recent stock changes</b><br>${h.slice().reverse().slice(0,12).map(x=>`${esc(x.color||'Legacy')} · size ${esc(x.size)} · ${x.quantity>0?'+':''}${x.quantity} (${esc(x.reason||'stock change')}) · ${new Date(x.createdAt).toLocaleString()}`).join('<br>')}`:'No stock changes recorded yet.'}
});
$("#detail").addEventListener("submit",async e=>{if(e.target.id!=='receiveForm')return;e.preventDefault();const data=new FormData(e.target);await stock(selectedId,{color:data.get('color'),size:data.get('size'),delta:Number(data.get('amount'))})});
async function stock(id,body){try{const p=await api(`/api/admin/products/${id}/stock`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});products=products.map(x=>x.id===id?p:x);render();toast('Stock saved')}catch(err){toast(err.message,true);load()}}
function clearPreviewUrls() {
  previewUrls.forEach(URL.revokeObjectURL);
  previewUrls = [];
}
function showPreview(images) {
  const pv = $("#preview");
  pv.replaceChildren();
  if (!images.length) {
    const empty = document.createElement("div");
    empty.className = "preview-empty";
    empty.textContent = "No photos chosen";
    pv.append(empty);
    return;
  }
  images.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.alt = "Product photo preview";
    pv.append(img);
  });
}
function previewImg() {
  clearPreviewUrls();
  const files = Array.from($("#images").files);
  if (files.length > 12) {
    $("#formErr").textContent = "Choose no more than 12 product photos.";
    $("#images").value = "";
    showPreview(currentProductImages());
    return;
  }
  if (files.reduce((total, file) => total + file.size, 0) > 4 * 1024 * 1024) {
    $("#formErr").textContent = "Product photos must total no more than 4MB.";
    $("#images").value = "";
    showPreview(currentProductImages());
    return;
  }
  $("#formErr").textContent = "";
  previewUrls = files.map(file => URL.createObjectURL(file));
  showPreview(previewUrls);
}
function currentProductImages() {
  const product = products.find(p => p.id === editingId);
  return product ? (product.images && product.images.length ? product.images : [product.image].filter(Boolean)) : [];
}
function openForm(p) {
  editingId = p ? p.id : null;
  clearPreviewUrls();
  $("#form").reset(); $("#formErr").textContent = "";
  $("#formTitle").textContent = p ? "Edit product" : "Add product";
  $("#name").value = p ? p.name : ""; $("#type").value = p ? p.type : "";
  $("#price").value = p && p.price != null ? p.price : ""; $("#desc").value = p ? p.desc : "";
  $("#colors").value = p ? p.colors.join(", ") : "";
  $("#sizeMin").value = p ? p.sizeMin : 43; $("#sizeMax").value = p ? p.sizeMax : 48;
  $("#quantity").value = p ? p.quantity : 0; $("#available").checked = p ? p.available : true;
  showPreview(currentProductImages());
  $("#formModal").classList.add("open");
}
function closeForm() { clearPreviewUrls(); $("#formModal").classList.remove("open"); }

async function saveProduct(e) {
  e.preventDefault(); $("#formErr").textContent = "";
  const images = Array.from($("#images").files);
  if (!editingId && !images.length) { $("#formErr").textContent = "Please choose at least one product photo."; return; }
  if (images.length > 12) { $("#formErr").textContent = "Choose no more than 12 product photos."; return; }
  if (images.reduce((total, file) => total + file.size, 0) > 4 * 1024 * 1024) { $("#formErr").textContent = "Product photos must total no more than 4MB."; return; }
  const fd = new FormData();
  for (const k of ["name", "type", "price", "desc", "colors", "sizeMin", "sizeMax", "quantity"]) fd.append(k, $("#" + k).value);
  fd.append("available", $("#available").checked);
  images.forEach(image => fd.append("images", image));
  const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "Saving...";
  try {
    await api(editingId ? `/api/admin/products/${editingId}` : "/api/admin/products", { method: editingId ? "PUT" : "POST", body: fd });
    closeForm(); await load(); toast("Saved");
  } catch (err) { $("#formErr").textContent = err.message; }
  finally { btn.disabled = false; btn.textContent = "Save product"; }
}

(async () => { try { await api("/api/admin/me"); if (showApp()) load(); } catch { showLogin(); } })();
</script>
