<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Sales history — PALMZ Admin</title>
<style>
:root{color-scheme:light;--bg:#f7f5ef;--surface:#fff;--surface2:#f1efe8;--text:#11141c;--muted:#6e6d68;--line:rgba(17,20,28,.12);--navy:#0c1227;--gold:#c9a34a;--red:#b3261e;--green:#1f8a4c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.top{background:var(--navy);color:#fff}.top .wrap{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:13px;font-weight:900;letter-spacing:.18em;color:#fff;text-decoration:none}.nav{display:flex;align-items:center;gap:8px}.nav a,.nav button,.refresh{padding:8px 13px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:transparent;color:#eee;font-size:12px;text-decoration:none}.nav .active{background:var(--gold);color:#111;border-color:var(--gold)}main{padding:28px 0 60px}.heading{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.heading h1{font:700 32px Georgia,serif;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.refresh{background:var(--navy);color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stat b{display:block;font-size:23px}.stat span{color:var(--muted);font-size:11px}.toolbar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}.toolbar input{width:min(100%,380px);padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text)}.table-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}table{width:100%;min-width:730px;border-collapse:collapse}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;background:#faf9f5}tbody tr:last-child td{border-bottom:0}.order-id{font:11px ui-monospace,monospace;color:var(--muted);margin-top:4px}.items{margin:0;padding-left:17px;line-height:1.65}.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:#e8f4eb;color:var(--green);font-size:10px;font-weight:800;white-space:nowrap}.badge.reversed{background:#f8e9e7;color:var(--red)}.empty,.error{padding:42px 18px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,12px);opacity:0;background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){.nav{gap:4px}.nav a,.nav button{padding:7px 9px;font-size:11px}.heading h1{font-size:27px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}
</style>
<style>.drawer-links a[href="/admin/orders"]{display:flex;align-items:center}.orders-notification{min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;margin-left:auto;border-radius:999px;background:#d9473f;color:#fff;font-size:10px;font-weight:850;letter-spacing:0}.orders-notification[hidden]{display:none}</style>
<style>
.loading-indicator{display:inline-flex;align-items:center;gap:9px}.spinner{width:15px;height:15px;flex:0 0 15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}button.is-loading{position:relative;color:transparent!important;pointer-events:none}button.is-loading::after{content:"";position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-8px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.menu-toggle{width:42px;height:42px;padding:10px;display:grid;align-content:center;gap:5px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:none;color:#fff}.menu-toggle span{height:2px;background:currentColor;border-radius:2px}
.drawer-backdrop{position:fixed;inset:0;z-index:60;border:0;background:rgba(5,9,20,.5);opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}.drawer-backdrop.open{opacity:1;visibility:visible}
.admin-drawer{position:fixed;z-index:61;inset:0 0 0 auto;width:min(330px,86vw);padding:22px;background:var(--navy);color:#fff;transform:translateX(102%);transition:transform .25s ease;box-shadow:-14px 0 40px rgba(0,0,0,.2)}.admin-drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.14)}.drawer-title{font-weight:900;letter-spacing:.18em}.drawer-title small{display:block;margin-top:5px;color:var(--gold);font-size:10px;letter-spacing:.14em}
.drawer-close{width:38px;height:38px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:none;color:#fff;font-size:23px}.drawer-links{display:grid;gap:8px;padding:20px 0}.drawer-links a,.drawer-links button{display:block;width:100%;padding:13px 14px;border:0;border-radius:11px;background:transparent;color:#eeece5;text-align:left;font-size:14px;text-decoration:none}.drawer-links a:hover,.drawer-links a[aria-current="page"],.drawer-links button:hover{background:rgba(255,255,255,.09)}.drawer-links a[aria-current="page"]{color:var(--gold);font-weight:800}body.menu-open{overflow:hidden}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="/admin" class="brand">PALMZ ADMIN</a><button class="menu-toggle" type="button" aria-label="Open admin navigation" aria-expanded="false" aria-controls="adminDrawer" onclick="toggleAdminMenu(true)"><span></span><span></span><span></span></button></div></header>
<button class="drawer-backdrop" id="drawerBackdrop" type="button" aria-label="Close navigation" onclick="toggleAdminMenu(false)"></button>
<aside class="admin-drawer" id="adminDrawer" aria-label="Admin navigation" aria-hidden="true" inert><div class="drawer-head"><div class="drawer-title">PALMZ<small>ADMIN MENU</small></div><button class="drawer-close" type="button" aria-label="Close navigation" onclick="toggleAdminMenu(false)">×</button></div><nav class="drawer-links"><a href="/admin">Inventory</a><a href="/admin/orders">Orders <span class="orders-notification" hidden aria-label="Pending orders"></span></a><a href="/admin/sales" aria-current="page">Sales history</a><a href="/" target="_blank" rel="noopener">View store ↗</a><button type="button" onclick="logout()">Sign out</button></nav></aside>
<main class="wrap">
  <div class="heading"><div><h1>Sales history</h1><div class="muted">Every order confirmed or fulfilled is recorded here. Reversed orders remain visible for reference.</div></div><button class="refresh" type="button" onclick="loadSales()">Refresh</button></div>
  <section class="stats" id="stats" aria-live="polite"></section>
  <div class="toolbar"><input id="search" type="search" placeholder="Search sales, customers, or products…" oninput="renderSales()"><span class="muted" id="count"></span></div>
  <div class="table-wrap"><table><thead><tr><th>Sale date</th><th>Order</th><th>Customer</th><th>Items sold</th><th>Value</th><th>Result</th></tr></thead><tbody id="sales"><tr><td colspan="6" class="empty"><span class="loading-indicator"><span class="spinner" aria-hidden="true"></span>Loading sales…</span></td></tr></tbody></table></div>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);let sales=[];
function toggleAdminMenu(open){const drawer=$("#adminDrawer"),backdrop=$("#drawerBackdrop"),toggle=$(".menu-toggle");drawer.classList.toggle("open",open);backdrop.classList.toggle("open",open);drawer.setAttribute("aria-hidden",String(!open));drawer.inert=!open;toggle.setAttribute("aria-expanded",String(open));document.body.classList.toggle("menu-open",open);if(open)$(".drawer-close").focus();else toggle.focus()}
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&$("#adminDrawer").classList.contains("open"))toggleAdminMenu(false)});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n){return '₦'+Number(n).toLocaleString('en-NG')}
async function request(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options}),d=await r.json().catch(()=>({}));if(r.status===401){location.replace('/admin');throw new Error('Sign in again')}if(!r.ok)throw new Error(d.error||'Could not load sales');return d}
async function loadSales(){const button=document.querySelector('.refresh');button.disabled=true;button.classList.add('is-loading');$('#sales').innerHTML='<tr><td colspan="6" class="empty"><span class="loading-indicator"><span class="spinner" aria-hidden="true"></span>Loading sales…</span></td></tr>';try{sales=(await request('/api/admin/sales')).sales;renderSales()}catch(error){if(error.message!=='Sign in again'){$('#sales').innerHTML=`<tr><td colspan="6" class="error">${esc(error.message)}</td></tr>`}}finally{button.disabled=false;button.classList.remove('is-loading')}}
function renderSales(){const q=$('#search').value.trim().toLowerCase(),shown=sales.filter(s=>!q||`${s.orderId} ${s.customerName} ${s.email} ${(s.items||[]).map(i=>i.name+' '+i.color+' '+i.size).join(' ')}`.toLowerCase().includes(q));const successful=sales.filter(s=>!s.reversed),pairs=successful.reduce((n,s)=>n+(s.items||[]).reduce((m,i)=>m+Number(i.quantity||0),0),0),value=successful.reduce((n,s)=>n+(s.items||[]).reduce((m,i)=>m+(i.unitPrice==null?0:Number(i.unitPrice)*Number(i.quantity||0)),0),0);$('#stats').innerHTML=`<div class="stat"><b>${successful.length}</b><span>Successful sales</span></div><div class="stat"><b>${pairs}</b><span>Pairs sold</span></div><div class="stat"><b>${money(value)}</b><span>Recorded order value</span></div>`;$('#count').textContent=`${shown.length} record${shown.length===1?'':'s'}`;$('#sales').innerHTML=shown.length?shown.map(s=>{const value=(s.items||[]).every(i=>i.unitPrice!=null)?money(s.items.reduce((n,i)=>n+Number(i.unitPrice)*Number(i.quantity||0),0)):'—';return `<tr><td>${new Intl.DateTimeFormat('en-NG',{dateStyle:'medium',timeStyle:'short'}).format(new Date(s.soldAt))}</td><td><b>${esc(s.orderId.slice(-8).toUpperCase())}</b><div class="order-id">${s.legacy?'Imported confirmation':'Confirmed order'}</div></td><td>${esc(s.customerName)}<div class="order-id">${esc(s.email)}</div></td><td><ul class="items">${(s.items||[]).map(i=>`<li>${Number(i.quantity)} × ${esc(i.name)} · ${esc(i.color)} · size ${esc(i.size)}</li>`).join('')}</ul></td><td>${value}</td><td><span class="badge ${s.reversed?'reversed':''}">${s.reversed?'Reversed':'Successful'}</span></td></tr>`}).join(''):'<tr><td colspan="6" class="empty">No confirmed sales yet.</td></tr>'}
async function logout(){await fetch('/api/admin/logout',{method:'POST',credentials:'same-origin'});location.replace('/admin')}
loadSales();
</script>
<script src="/admin-notifications.js"></script>
</body>
</html>
