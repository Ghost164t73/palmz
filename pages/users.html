<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Users — PALMZ Admin</title>
  <style>
    :root{color-scheme:dark;--bg:#080d19;--surface:#101a2b;--surface2:#172338;--text:#eef3fb;--muted:#91a1b8;--line:rgba(148,163,184,.16);--navy:#0b1322;--gold:#c9a34a;--red:#fb6b73;--green:#23c879}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}
    .top{position:sticky;top:0;z-index:30;margin-left:236px;background:#0d1524;border-bottom:1px solid var(--line);transition:margin-left .24s}.top-inner{height:72px;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:14px;font-weight:900;letter-spacing:.18em}.menu-toggle{display:none}
    .drawer{position:fixed;z-index:61;inset:0 auto 0 0;width:236px;padding:22px 16px;background:var(--surface);border-right:1px solid var(--line);transition:width .24s,padding .24s}.drawer-head{display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:12px 10px 24px;border-bottom:1px solid var(--line)}.drawer-title{font-weight:900;letter-spacing:.18em}.drawer-title small{display:block;margin-top:5px;color:var(--gold);font-size:10px;letter-spacing:.14em}.collapse{display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--gold);cursor:pointer}.collapse svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}.drawer-links{display:grid;gap:8px;padding:22px 0}.drawer-links a,.drawer-links button{display:flex;align-items:center;gap:12px;padding:14px 12px;border:0;border-radius:14px;background:transparent;color:#aab8cc;text-align:left}.drawer-links a:hover,.drawer-links button:hover{background:rgba(255,255,255,.06);color:#fff}.drawer-links a[aria-current=page]{background:rgba(201,163,74,.16);color:#e6c36e}.nav-icon{display:grid;place-items:center;width:24px;flex:0 0 24px;font-size:19px;color:currentColor}.nav-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    main{width:calc(100% - 284px);margin:0 24px 0 260px;padding:36px 0 60px;transition:width .24s,margin-left .24s}.heading{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.heading h1{margin:0 0 5px;font:700 32px Georgia,serif}.muted{color:var(--muted);font-size:13px}.refresh{padding:9px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.stat{padding:17px 20px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;gap:12px;margin:18px 0 12px}.toolbar input{width:min(100%,430px);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);outline:none}.toolbar input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,163,74,.15)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}table{width:100%;min-width:650px;border-collapse:collapse}th,td{padding:15px 17px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:13px}th{background:var(--surface2);color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}tbody tr:last-child td{border-bottom:0}.user-cell{display:flex;align-items:center;gap:11px}.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;object-fit:cover;background:var(--surface2)}.initials{display:grid;place-items:center;color:var(--gold);font-weight:800}.sub{margin-top:3px;color:var(--muted);font-size:11px}.empty,.error{padding:42px 18px;text-align:center;color:var(--muted)}
    .pagination{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px;padding:16px 20px;border:1px solid var(--line);border-top:0;border-radius:0 0 20px 20px;background:var(--surface);color:var(--muted);font-size:13px}.pager-pages{display:flex;gap:8px}.pager-pages button,.pager-select{min-width:42px;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text)}.pager-pages button[aria-current=page]{border-color:var(--gold);background:var(--gold);color:#171208}.pager-pages button:disabled{opacity:.4;cursor:not-allowed}.pager-size{display:flex;align-items:center;gap:8px}.pager-select{background:var(--surface2)}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,12px);opacity:0;padding:10px 16px;border-radius:999px;background:var(--navy);color:#fff;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    body.sidebar-collapsed .drawer{width:82px;padding-inline:12px}body.sidebar-collapsed .drawer-head{justify-content:center;padding-inline:0}body.sidebar-collapsed .drawer-title,body.sidebar-collapsed .nav-label{display:none}body.sidebar-collapsed .collapse svg{transform:rotate(180deg)}body.sidebar-collapsed .drawer-links a,body.sidebar-collapsed .drawer-links button{justify-content:center;padding:14px 4px}body.sidebar-collapsed .top{margin-left:82px}body.sidebar-collapsed main{width:calc(100% - 130px);margin-left:106px}
    .backdrop{display:none}.close{display:none}@media(max-width:760px){.top{margin-left:0}.top-inner{height:64px;padding:0 16px}.menu-toggle{display:grid;gap:5px;width:42px;height:42px;padding:10px;border:1px solid var(--line);border-radius:12px;background:none}.menu-toggle span{height:2px;background:var(--text)}.drawer{z-index:71;left:auto;right:0;width:min(330px,86vw);transform:translateX(102%);transition:transform .25s}.drawer.open{transform:translateX(0)}.drawer-head{justify-content:space-between}.collapse{display:none}.close{display:block;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:none;color:var(--text);font-size:22px}.backdrop.open{display:block;position:fixed;inset:0;z-index:70;border:0;background:rgba(5,9,20,.55)}main,body.sidebar-collapsed main{width:calc(100% - 28px);margin:0 14px;padding-top:26px}.heading h1{font-size:27px}.stats{gap:8px}.stat{padding:14px}.pagination{align-items:stretch;flex-direction:column}.pager-pages{justify-content:center}.pager-meta{display:flex;justify-content:space-between}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
  </style>
</head>
<body>
<header class="top"><div class="top-inner"><a class="brand" href="/admin">PALMZ ADMIN</a><button class="menu-toggle" aria-label="Open admin navigation" aria-expanded="false" onclick="toggleMenu(true)"><span></span><span></span><span></span></button></div></header>
<button class="backdrop" id="backdrop" aria-label="Close navigation" onclick="toggleMenu(false)"></button>
<aside class="drawer" id="drawer" aria-label="Admin navigation"><div class="drawer-head"><div class="drawer-title"><span>PALMZ</span><small>ADMIN MENU</small></div><button class="collapse" id="collapse" aria-label="Collapse sidebar" title="Collapse sidebar" onclick="toggleCollapse()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg></button><button class="close" aria-label="Close navigation" onclick="toggleMenu(false)">×</button></div><nav class="drawer-links">
  <a href="/admin" title="Inventory"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg></span><span class="nav-label">Inventory</span></a><a href="/admin/orders" title="Orders"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span><span class="nav-label">Orders</span></a><a href="/admin/sales" title="Sales history"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 6-7"/><path d="M15 6h5v5"/></svg></span><span class="nav-label">Sales history</span></a><a href="/admin/promos" title="Promo codes"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13 12 21.5 2.5 12V3.5H11z"/><circle cx="7" cy="8" r="1"/><path d="m9 15 6-6"/><circle cx="15.5" cy="15.5" r="1"/></svg></span><span class="nav-label">Promo codes</span></a><a href="/admin/users" aria-current="page" title="Users"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span class="nav-label">Users</span></a><a href="/admin/delivery" title="Delivery rates"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11v12H3zM14 10h4l3 3v5h-7"/><circle cx="7.5" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/></svg></span><span class="nav-label">Delivery rates</span></a><a href="/" target="_blank" rel="noopener" title="View store"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9M9 21v-7h6v7"/></svg></span><span class="nav-label">View store</span></a><button type="button" onclick="logout()" title="Sign out"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg></span><span class="nav-label">Sign out</span></button>
</nav></aside>
<main>
  <div class="heading"><div><h1>Users</h1><div class="muted">Signed-in customer accounts, newest first.</div></div><button class="refresh" id="refresh" type="button" onclick="loadUsers()">Refresh</button></div>
  <section class="stats" id="stats" aria-live="polite"><div class="stat"><b>—</b><span>Registered users</span></div><div class="stat"><b>—</b><span>Orders from listed users</span></div></section>
  <div class="toolbar"><input id="search" type="search" placeholder="Search name or email…" aria-label="Search users"><span class="muted" id="count"></span></div>
  <div class="table-wrap"><table><thead><tr><th>Customer</th><th>Email</th><th>Joined</th><th>Orders</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="empty">Loading users…</td></tr></tbody></table></div><div class="pagination" id="pager"></div>
</main><div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page=1,limit=25,total=0,searchTimer;
function toggleCollapse(){document.body.classList.toggle('sidebar-collapsed');try{localStorage.setItem('palmz-admin-sidebar-collapsed',document.body.classList.contains('sidebar-collapsed')?'1':'0')}catch{}}
try{document.body.classList.toggle('sidebar-collapsed',localStorage.getItem('palmz-admin-sidebar-collapsed')==='1')}catch{}
function toggleMenu(open){$('#drawer').classList.toggle('open',open);$('#backdrop').classList.toggle('open',open);$('.menu-toggle').setAttribute('aria-expanded',String(open));$('.menu-toggle').setAttribute('aria-label',open?'Close admin navigation':'Open admin navigation');document.body.style.overflow=open?'hidden':''}
async function request(url){const r=await fetch(url,{credentials:'same-origin'}),d=await r.json().catch(()=>({}));if(r.status===401){location.replace('/admin');throw new Error('Sign in again')}if(!r.ok)throw new Error(d.error||'Could not load users');return d}
function date(value){return value?new Intl.DateTimeFormat('en-NG',{dateStyle:'medium'}).format(new Date(value)):'—'}
async function loadUsers(){const button=$('#refresh');button.disabled=true;$('#rows').innerHTML='<tr><td colspan="4" class="empty">Loading users…</td></tr>';try{const q=new URLSearchParams({page,limit,search:$('#search').value.trim()}),data=await request('/api/admin/users?'+q);total=data.total;const users=data.users||[];$('#stats').innerHTML=`<div class="stat"><b>${Number(total).toLocaleString('en-NG')}</b><span>Registered users</span></div><div class="stat"><b>${users.reduce((n,u)=>n+Number(u.orderCount||0),0).toLocaleString('en-NG')}</b><span>Orders from this page</span></div>`;$('#count').textContent=`${total.toLocaleString('en-NG')} account${total===1?'':'s'}`;$('#rows').innerHTML=users.length?users.map(u=>{const initials=String(u.name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();return `<tr><td><div class="user-cell"><span class="avatar initials">${esc(initials)}</span><b>${esc(u.name)}</b></div></td><td>${esc(u.email)}</td><td>${date(u.createdAt)}</td><td>${Number(u.orderCount||0).toLocaleString('en-NG')}</td></tr>`}).join(''):'<tr><td colspan="4" class="empty">No customer accounts match this search.</td></tr>';renderPager()}catch(error){if(error.message!=='Sign in again')$('#rows').innerHTML=`<tr><td colspan="4" class="error">${esc(error.message)} <button class="refresh" onclick="loadUsers()">Try again</button></td></tr>`}finally{button.disabled=false}}
function renderPager(){const pages=Math.ceil(total/limit),el=$('#pager');if(!pages){el.innerHTML='';return}el.innerHTML=`<div class="pager-pages"><button type="button" ${page<=1?'disabled':''} id="prev">‹</button><span>Page ${page} of ${pages}</span><button type="button" ${page>=pages?'disabled':''} id="next">›</button></div><div class="pager-meta"><span>Showing ${Math.min((page-1)*limit+1,total)}–${Math.min(page*limit,total)} of ${total}</span><label class="pager-size">Show <select class="pager-select" id="limit"><option ${limit===25?'selected':''}>25</option><option ${limit===50?'selected':''}>50</option><option ${limit===100?'selected':''}>100</option></select></label></div>`;$('#prev').onclick=()=>{page--;loadUsers()};$('#next').onclick=()=>{page++;loadUsers()};$('#limit').onchange=e=>{limit=Number(e.target.value);page=1;loadUsers()}}
$('#search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;loadUsers()},250)});
async function logout(){await fetch('/api/admin/logout',{method:'POST',credentials:'same-origin'});location.replace('/admin')}
loadUsers();
</script><script src="/admin-notifications.js"></script>
</body></html>
